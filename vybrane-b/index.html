/* ==================================================
   MIEŠANIE
================================================== */

function shuffle(a){

  a=[
    ...a
  ];


  for(
    let i=a.length-1;
    i>0;
    i--
  ){

    let j=
      Math.floor(
        Math.random()*
        (i+1)
      );


    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }


  return a;
}



/* ==================================================
   LEVEL
================================================== */

function chooseLevel(
  n,
  btn
){

  level=n;


  document
  .querySelectorAll(
    ".level"
  )
  .forEach(
    b=>
      b.classList
      .remove(
        "active"
      )
  );


  btn
  .classList
  .add(
    "active"
  );

}



/* ==================================================

================================================== */

function show(id){

  [
    "home",
    "game",
    "finish"
  ]
  .forEach(
    x=>
      document
      .getElementById(x)
      .classList
      .add("hidden")
  );


  document
  .getElementById(id)
  .classList
  .remove("hidden");


  window.scrollTo(
    0,
    0
  );

}



/* ==================================================
   CHYBY
================================================== */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage
      .getItem(
        "damtoB"
      ) || "{}"
    );

  }
  catch(e){

    return {};

  }

}



function saveMistakes(x){

  localStorage
  .setItem(
    "damtoB",
    JSON.stringify(x)
  );


  updateMistakes();

}



function wrongAnswer(id){

  let m=
    getMistakes();


  m[id]=
    (
      m[id] ||
      0
    )+
    1;


  saveMistakes(m);

}



function correctAnswer(id){

  let m=
    getMistakes();


  if(
    m[id]
  ){

    m[id]--;


    if(
      m[id]<=0
    ){

      delete m[id];

    }


    saveMistakes(m);

  }

}



function updateMistakes(){

  let n=
    Object.keys(
      getMistakes()
    ).length;


  document
  .getElementById(
    "mistakeCount"
  )
  .textContent=
    n
    ? "("+n+")"
    : "";

}



/* ==================================================
   BALÍČEK OTÁZOK
================================================== */

function buildDeck(){

  let m=
    getMistakes();


  let yWords=
    database.filter(
      x=>
        x.correct==="y" ||
        x.correct==="ý"
    );


  let iWords=
    database.filter(
      x=>
        x.correct==="i" ||
        x.correct==="í"
    );


  yWords=[

    ...shuffle(
      yWords.filter(
        x=>m[x.id]
      )
    ),

    ...shuffle(
      yWords.filter(
        x=>!m[x.id]
      )
    )

  ];


  iWords=[

    ...shuffle(
      iWords.filter(
        x=>m[x.id]
      )
    ),

    ...shuffle(
      iWords.filter(
        x=>!m[x.id]
      )
    )

  ];


  return shuffle([

    ...yWords.slice(
      0,
      5
    ),

    ...iWords.slice(
      0,
      5
    )

  ]);

}



/* ==================================================
   ŠTART

  let m=

  let list=
    database.filter(
      x=>m[x.id]
    );

    !list.length
  ){

    alert(

  questions=
    shuffle(list)
    .slice(

      10
    );


  current=0;

  score=0;


  show(
    "game"
  );


  render();

}

  .classList
  .add(
    "hidden"
  );


  document
  .getElementById(
    "levelBadge"
  )
  .textContent=

    level===1
    ? "⭐ Skúšam"

    : level===2
    ? "⭐⭐ Už mi to ide"

    : "⭐⭐⭐ DámTo!";



  /* ==============================
     LEVEL 1
  ============================== */

  if(
    level===1
  ){

    document
    .getElementById(
      "instruction"
    )
    .textContent=
      "✏️ Doplň správne písmeno";


    document
    .getElementById(
      "question"
    )
    .textContent=
      x.gap;


    let wrong=

      x.correct==="i"
      ? "y"

      : x.correct==="í"
      ? "ý"

      : x.correct==="y"
      ? "i"

      : "í";


    createAnswers(
      [
        x.correct,
        wrong
      ],
      x.correct
    );

  }



  /* ==============================
     LEVEL 2
  ============================== */

  if(
    level===2
  ){

    document
    .getElementById(
      "instruction"
    )
    .textContent=
      "🧩 Vyber správne slovo";


    document
    .getElementById(
      "question"
    )
    .textContent=
      "Ktoré slovo je správne?";


    createAnswers(
      [
        x.word,
        x.wrong
      ],
      x.word
    );

  }



  /* ==============================
     LEVEL 3
  ============================== */

  if(
    level===3
  ){

    document
    .getElementById(
      "instruction"
    )
    .textContent=
      "🔎 Lovec chýb";


    document
    .getElementById(
      "question"
    )
    .textContent=
      "Ktorá veta je napísaná správne?";


    let good=
      shuffle(
        x.sentences
      )[0];


    let bad=
      good.replace(
        x.word,
        x.wrong
      );


    if(
      good===bad
    ){

      current++;

      render();

      return;

    }


    createAnswers(
      [
        good,
        bad
      ],
      good
    );

  }

}



/* ==================================================
   ODPOVEDE
================================================== */

function createAnswers(
  options,
  correct
){

  let box=
    document
    .getElementById(
      "answers"
    );


  box.innerHTML=
    "";


  const mixed=
    shuffle(
      options
    );


  mixed
  .forEach(
    (
      option,
      index
    )=>{

      let b=
        document
        .createElement(
          "button"
        );


      b.className=
        "answer";


      b.textContent=
        option;


      b.dataset.correct=
        String(
          option===
          correct
        );


      b.onclick=
        ()=>{

          selectedAnswerIndex=
            index;


          updateKeyboardSelection();


          check(
            option===
            correct
          );

        };


      box.appendChild(
        b
      );

    }
  );


  updateKeyboardSelection();

}



/* ==================================================
   KLÁVESNICOVÉ ZVÝRAZNENIE
================================================== */

function updateKeyboardSelection(){

  const buttons=[
    ...document
    .querySelectorAll(
      ".answer"
    )
  ];


  buttons
  .forEach(
    (
      button,
      index
    )=>{

      button
      .classList
      .toggle(

        "keyboardSelected",

        index===
        selectedAnswerIndex &&
        !button.disabled

      );

    }
  );

}



/* ==================================================
   KONTROLA
================================================== */

function check(ok){

  if(
    locked
  ){
    return;
  }


  locked=true;


  let x=
    questions[current];


  let f=
    document
    .getElementById(
      "feedback"
    );


  if(
    ok
  ){

    score++;


    correctAnswer(
      x.id
    );


    f.className=
      "feedback good";


    f.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    wrongAnswer(
      x.id
    );


    f.className=
      "feedback bad";


    /* podľa dohody NIE „Ešte nie“ */

    f.innerHTML=
      "❌ <b>Nesprávne.</b> Správne je <b>"+
      x.word+
      "</b>.";

  }


  document
  .getElementById(
    "points"
  )
  .textContent=
    score;


  document
  .querySelectorAll(
    ".answer"
  )
  .forEach(
    b=>
      b.disabled=
        true
  );


  document
  .getElementById(
    "next"
  )
  .classList
  .remove(
    "hidden"
  );

}



/* ==================================================
   ĎALŠIA OTÁZKA
================================================== */

function nextQuestion(){

  current++;


  render();


  window.scrollTo(
    0,
    0
  );

}



/* ==================================================
   ŠÍPKY + ENTER
================================================== */

document
.addEventListener(
  "keydown",
  event=>{

    /* iba počas hry */

    if(
      document
      .getElementById(
        "game"
      )
      .classList
      .contains(
        "hidden"
      )
    ){

      return;

    }


    const buttons=[
      ...document
      .querySelectorAll(
        ".answer"
      )
    ];


    /* po odpovedi ENTER = ďalšia */

    if(
      locked &&
      event.key===
      "Enter"
    ){

      event
      .preventDefault();


      nextQuestion();

      return;

    }


    if(
      locked ||
      !buttons.length
    ){

      return;

    }



    /* šípka doprava / dole */

    if(
      event.key===
      "ArrowRight" ||
      event.key===
      "ArrowDown"
    ){

      event
      .preventDefault();


      selectedAnswerIndex=
        (
          selectedAnswerIndex+
          1
        )%
        buttons.length;


      updateKeyboardSelection();

      return;

    }



    /* šípka doľava / hore */

    if(
      event.key===
      "ArrowLeft" ||
      event.key===
      "ArrowUp"
    ){

      event
      .preventDefault();


      selectedAnswerIndex=
        (
          selectedAnswerIndex-
          1+
          buttons.length
        )%
        buttons.length;


      updateKeyboardSelection();

      return;

    }



    /* ENTER = potvrdenie */

    if(
      event.key===
      "Enter"
    ){

      event
      .preventDefault();


      const selected=
        buttons[
          selectedAnswerIndex
        ];


      if(
        selected &&
        !selected.disabled
      ){

        selected.click();

      }

    }

  }
);



/* ==================================================
   KONIEC
================================================== */

function finish(){

  document
  .getElementById(
    "finalScore"
  )
  .textContent=
    score+
    " / "+
    questions.length;


  let p=
    score/
    questions.length;


  document
  .getElementById(
    "finalMessage"
  )
  .textContent=

    p===1
    ? "Perfektné! Bez chyby. 🌟"

    : p>=.8
    ? "Výborne! 🚀"

    : p>=.6
    ? "Pekná práca. 💪"

    : "Skús ešte jeden tréning. 🌱";


  updateMistakes();


  show(
    "finish"
  );

}



/* ==================================================
   ŠTART
================================================== */

updateMistakes();


</script>

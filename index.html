<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DámTo! – Slová a pravopis</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.app{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.hero{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  font-size:58px;
  font-weight:900;
  margin:0;
}

.logo span{color:#ff9f1c}

.subtitle{
  color:#65758b;
  font-weight:700;
  font-size:20px;
}

.card{
  background:#fff;
  border-radius:28px;
  padding:28px;
  box-shadow:0 15px 40px rgba(23,54,93,.12);
}

.hidden{display:none!important}

.levels{
  display:grid;
  gap:12px;
  margin:22px 0;
}

button{
  font-family:inherit;
  cursor:pointer;
}

.level{
  border:2px solid transparent;
  border-radius:20px;
  padding:18px;
  background:#eef6ff;
  color:#17365d;
  font-size:19px;
  font-weight:800;
}

.level.active{
  border-color:#ff9f1c;
  background:#fff7e8;
}

.small{
  display:block;
  font-size:14px;
  color:#718096;
  margin-top:5px;
}

.primary{
  width:100%;
  border:0;
  border-radius:18px;
  padding:16px;
  background:#2f80ed;
  color:#fff;
  font-size:19px;
  font-weight:800;
}

.secondary{
  border:0;
  border-radius:16px;
  padding:12px 16px;
  background:#eef6ff;
  color:#17365d;
  font-weight:800;
}

.mistakes{
  width:100%;
  margin-top:10px;
  border:0;
  border-radius:18px;
  padding:15px;
  background:#fff4df;
  color:#805400;
  font-size:17px;
  font-weight:800;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.badge{
  background:#fff4df;
  padding:9px 14px;
  border-radius:30px;
  font-weight:800;
}

.progress{
  height:13px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:18px 0 10px;
}

.bar{
  height:100%;
  width:0;
  background:#ff9f1c;
  transition:.3s;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#65758b;
  font-weight:700;
}

.instruction{
  margin-top:25px;
  color:#65758b;
  font-weight:700;
  font-size:18px;
}

.question{
  font-size:42px;
  font-weight:900;
  margin:25px 0;
  text-align:center;
}

.answers{
  display:grid;
  gap:12px;
}

.answer{
  border:2px solid #dce7f2;
  background:white;
  color:#17365d;
  border-radius:18px;
  padding:17px;
  font-size:22px;
  font-weight:800;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.feedback{
  margin-top:16px;
  padding:15px;
  border-radius:17px;
  line-height:1.5;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

.next{margin-top:14px}

.score{
  font-size:55px;
  font-weight:900;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:13px;
  margin-top:18px;
}

@media(max-width:520px){
  .app{padding:12px}
  .card{padding:20px 15px}
  .logo{font-size:43px}
  .question{font-size:31px}
}
</style>
</head>

<body>

<div class="app">

<div class="hero">
  <h1 class="logo">Dám<span>To!</span></h1>
  <div class="subtitle">Každý deň o level vyššie.</div>
</div>

<section id="home" class="card">

  <h1 style="text-align:center">🔤 Slová a pravopis</h1>

  <h2 style="text-align:center">
    Tvrdé a mäkké spoluhlásky
  </h2>

  <p style="text-align:center;color:#718096">
    Vyber si level. V každom tréningu dostaneš
    náhodný mix slov s i/í aj y/ý.
  </p>

  <div class="levels">

    <button class="level active" onclick="chooseLevel(1,this)">
      ⭐ Skúšam
      <span class="small">Doplň správne písmeno</span>
    </button>

    <button class="level" onclick="chooseLevel(2,this)">
      ⭐⭐ Už mi to ide
      <span class="small">Vyber správne slovo</span>
    </button>

    <button class="level" onclick="chooseLevel(3,this)">
      ⭐⭐⭐ DámTo!
      <span class="small">Lovec chýb – vyber správnu vetu</span>
    </button>

  </div>

  <button class="primary" onclick="startTraining()">
    ▶ Začať tréning
  </button>

  <button class="mistakes" onclick="startMistakes()">
    🎯 Precvičiť moje chyby
    <span id="mistakeCount"></span>
  </button>

</section>


<section id="game" class="card hidden">

  <div class="top">

    <button class="secondary" onclick="goHome()">
      ← Späť
    </button>

    <div id="levelBadge" class="badge"></div>

  </div>

  <div class="progress">
    <div id="progressBar" class="bar"></div>
  </div>

  <div class="stats">
    <span id="counter"></span>
    <span>🏆 <span id="points">0</span></span>
  </div>

  <div id="instruction" class="instruction"></div>

  <div id="question" class="question"></div>

  <div id="answers" class="answers"></div>

  <div id="feedback"></div>

  <button
    id="nextButton"
    class="primary next hidden"
    onclick="nextQuestion()">
    Ďalej ➜
  </button>

</section>


<section id="finish" class="card hidden" style="text-align:center">

  <div style="font-size:60px">🏆</div>

  <h1>Tréning hotový!</h1>

  <div id="finalScore" class="score"></div>

  <p id="finalMessage"></p>

  <button class="primary" onclick="startTraining()">
    🔄 Nový náhodný mix
  </button>

  <br><br>

  <button class="secondary" onclick="goHome()">
    ⭐ Vybrať level
  </button>

</section>


<div class="footer">
  DámTo! • Každý deň o level vyššie.
</div>

</div>

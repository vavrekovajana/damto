<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DámTo! – Slová a pravopis</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:18px;
}

.logo{
  text-align:center;
  font-size:48px;
  font-weight:900;
  margin:5px;
}

.logo span{
  color:#ff9f1c;
}

.slogan{
  text-align:center;
  color:#718096;
  font-weight:700;
  margin-bottom:18px;
}

.card{
  background:white;
  border-radius:28px;
  padding:26px;
  box-shadow:0 15px 40px rgba(23,54,93,.12);
}

.center{
  text-align:center;
}

.hidden{
  display:none!important;
}

.levels{
  display:grid;
  gap:10px;
  margin:20px 0;
}

button{
  border:0;
  border-radius:18px;
  padding:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  border-color:#ff9f1c;
  background:#fff7e8;
}

.primary{
  width:100%;
  background:#2f80ed;
  color:white;
}

.mistakes{
  width:100%;
  margin-top:10px;
  background:#fff4df;
  color:#805400;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.badge{
  background:#fff4df;
  padding:8px 13px;
  border-radius:30px;
  font-weight:800;
}

.progress{
  height:12px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:14px 0;
}

.bar{
  height:100%;
  width:0;
  background:#ff9f1c;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#65758b;
  font-weight:700;
}

.instruction{
  margin-top:18px;
  color:#65758b;
  font-weight:700;
}

.question{
  text-align:center;
  font-size:38px;
  font-weight:900;
  margin:20px 0;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  background:white;
  border:2px solid #dce7f2;
  color:#17365d;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.feedback{
  margin-top:14px;
  padding:14px;
  border-radius:17px;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

.score{
  font-size:55px;
  font-weight:900;
  margin:15px;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:13px;
  margin-top:15px;
}


/* KOMPAKTNEJŠIA HRA NA NOTEBOOKU A PC */

@media (min-width:521px){

  #game.card{
    padding:18px 22px;
  }

  #game .top{
    margin-bottom:4px;
  }

  #game .progress{
    margin:8px 0;
    height:9px;
  }

  #game .instruction{
    margin-top:10px;
    font-size:15px;
  }

  #game .question{
    font-size:32px;
    margin:12px 0;
  }

  #game .answers{
    gap:7px;
  }

  #game .answer{
    padding:10px;
    font-size:16px;
  }

  #game .feedback{
    margin-top:8px;
    padding:9px;
  }

  #game #next{
    margin-top:8px!important;
    padding:10px;
  }
}


/* MOBIL */

@media(max-width:520px){

  .wrap{
    padding:10px;
  }

  .card{
    padding:19px 14px;
  }

  .logo{
    font-size:40px;
  }

  .question{
    font-size:29px;
  }
}

</style>
</head>

/* =====================================================
   PREMENNÉ
===================================================== */

let level=1;

let questions=[];

let current=0;

let score=0;

let locked=false;



/* =====================================================
   NÁHODNÉ PORADIE
===================================================== */

function shuffle(a){

  a=[...a];

  for(let i=a.length-1;i>0;i--){

    let j=Math.floor(
      Math.random()*(i+1)
    );

    [
      a[i],
      a[j]
    ]=[
      a[j],
      a[i]
    ];

  }

  return a;
}



/* =====================================================
   VÝBER LEVELU
===================================================== */

function chooseLevel(n,btn){

  level=n;

  document
    .querySelectorAll(".level")
    .forEach(
      b=>b.classList.remove("active")
    );

  btn.classList.add("active");

}



/* =====================================================
   PREPÍNANIE OBRAZOVIEK
===================================================== */

function show(id){

  [
    "home",
    "game",
    "finish"
  ].forEach(

    x=>
      document
        .getElementById(x)
        .classList
        .add("hidden")

  );

  document
    .getElementById(id)
    .classList
    .remove("hidden");

}



/* =====================================================
   ULOŽENÉ CHYBY
===================================================== */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "damtoMistakes"
      ) || "{}"
    );

  }
  catch(e){

    return {};

  }

}



function saveMistakes(x){

  localStorage.setItem(
    "damtoMistakes",
    JSON.stringify(x)
  );

  updateMistakes();

}



function wrongAnswer(id){

  let m=getMistakes();

  m[id]=(m[id]||0)+1;

  saveMistakes(m);

}



function correctAnswer(id){

  let m=getMistakes();

  if(m[id]){

    m[id]--;

    if(m[id]<=0){

      delete m[id];

    }

    saveMistakes(m);

  }

}



function updateMistakes(){

  let n=
    Object
      .keys(getMistakes())
      .length;

  document
    .getElementById("mistakeCount")
    .textContent=
      n
      ? "("+n+")"
      : "";

}



/* =====================================================
   MIX 5 × I/Í + 5 × Y/Ý
===================================================== */

function buildDeck(){

  let m=getMistakes();


  let soft=
    database.filter(

      x=>
        x.correct==="i" ||
        x.correct==="í"

    );


  let hard=
    database.filter(

      x=>
        x.correct==="y" ||
        x.correct==="ý"

    );


  soft=[

    ...shuffle(
      soft.filter(
        x=>m[x.id]
      )
    ),

    ...shuffle(
      soft.filter(
        x=>!m[x.id]
      )
    )

  ];


  hard=[

    ...shuffle(
      hard.filter(
        x=>m[x.id]
      )
    ),

    ...shuffle(
      hard.filter(
        x=>!m[x.id]
      )
    )

  ];


  return shuffle([

    ...soft.slice(0,5),

    ...hard.slice(0,5)

  ]);

}



/* =====================================================
   ZAČAŤ TRÉNING
===================================================== */

function startTraining(){

  questions=buildDeck();

  current=0;

  score=0;

  show("game");

  render();

}



/* =====================================================
   PRECVIČOVANIE CHÝB
===================================================== */

function startMistakes(){

  let m=getMistakes();

  let list=
    database.filter(
      x=>m[x.id]
    );


  if(!list.length){

    alert(
      "Zatiaľ nemáš uložené žiadne chyby. 🎉"
    );

    return;

  }


  questions=
    shuffle(list)
      .slice(0,10);

  current=0;

  score=0;

  show("game");

  render();

}



/* =====================================================
   SPÄŤ DOMOV
===================================================== */

function goHome(){

  updateMistakes();

  show("home");

}



/* =====================================================
   ZOBRAZENIE OTÁZKY
===================================================== */

function render(){

  locked=false;


  if(current>=questions.length){

    finish();

    return;

  }


  let x=
    questions[current];


  document
    .getElementById("counter")
    .textContent=
      (current+1)
      +" / "+
      questions.length;


  document
    .getElementById("points")
    .textContent=
      score;


  document
    .getElementById("bar")
    .style.width=
      (
        current /
        questions.length *
        100
      )
      +"%";


  document
    .getElementById("feedback")
    .innerHTML="";


  document
    .getElementById("feedback")
    .className="";


  document
    .getElementById("next")
    .classList
    .add("hidden");


  document
    .getElementById("levelBadge")
    .textContent=

      level===1
      ? "⭐ Skúšam"

      : level===2
      ? "⭐⭐ Už mi to ide"

      : "⭐⭐⭐ DámTo!";



  /* LEVEL 1 */

  if(level===1){

    document
      .getElementById("instruction")
      .textContent=
        "✏️ Doplň správne písmeno";


    document
      .getElementById("question")
      .textContent=
        x.gap;


    let wrong=

      x.correct==="i"
      ? "y"

      : x.correct==="í"
      ? "ý"

      : x.correct==="y"
      ? "i"

      : "í";


    answers(
      [
        x.correct,
        wrong
      ],
      x.correct
    );

  }



  /* LEVEL 2 */

  if(level===2){

    document
      .getElementById("instruction")
      .textContent=
        "🧩 Vyber správne slovo";


    document
      .getElementById("question")
      .textContent=
        "Ktoré slovo je správne?";


    answers(
      [
        x.word,
        x.wrong
      ],
      x.word
    );

  }



  /* LEVEL 3 */

  if(level===3){

    document
      .getElementById("instruction")
      .textContent=
        "🔎 Lovec chýb";


    document
      .getElementById("question")
      .textContent=
        "Ktorá veta je napísaná správne?";


    let good=
      shuffle(
        x.sentences
      )[0];


    let bad=
      good.replace(
        x.word,
        x.wrong
      );


    if(good===bad){

      current++;

      render();

      return;

    }


    answers(
      [
        good,
        bad
      ],
      good
    );

  }

}



/* =====================================================
   ODPOVEDE
===================================================== */

function answers(options,correct){

  let box=
    document
      .getElementById("answers");


  box.innerHTML="";


  shuffle(options)
    .forEach(option=>{


      let b=
        document
          .createElement("button");


      b.className=
        "answer";


      b.textContent=
        option;


      b.onclick=
        ()=>check(
          option===correct
        );


      box.appendChild(b);

    });

}



/* =====================================================
   VYHODNOTENIE
===================================================== */

function check(ok){

  if(locked){

    return;

  }


  locked=true;


  let x=
    questions[current];


  let f=
    document
      .getElementById("feedback");



  if(ok){

    score++;

    correctAnswer(
      x.id
    );


    f.className=
      "feedback good";


    f.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }


  else{

    wrongAnswer(
      x.id
    );


    f.className=
      "feedback bad";


    f.innerHTML=
      "💡 <b>Ešte nie.</b> Správne je <b>"
      +x.word+
      "</b>.";

  }


  document
    .getElementById("points")
    .textContent=
      score;


  document
    .querySelectorAll(".answer")
    .forEach(
      b=>b.disabled=true
    );


  document
    .getElementById("next")
    .classList
    .remove("hidden");

}



/* =====================================================
   ĎALŠIA OTÁZKA
===================================================== */

function nextQuestion(){

  current++;

  render();

}



/* =====================================================
   KONIEC TRÉNINGU
===================================================== */

function finish(){

  document
    .getElementById("finalScore")
    .textContent=
      score+
      " / "+
      questions.length;


  let p=
    score /
    questions.length;


  document
    .getElementById("finalMessage")
    .textContent=

      p===1
      ? "Perfektné! Bez chyby. 🌟"

      : p>=.8
      ? "Výborne! 🚀"

      : p>=.6
      ? "Pekná práca. 💪"

      : "Skús ešte jeden tréning. 🌱";


  updateMistakes();

  show("finish");

}



/* =====================================================
   ENTER = ĎALŠIA OTÁZKA
===================================================== */

document.addEventListener(
  "keydown",
  function(event){


    if(event.key==="Enter"){


      const nextButton=
        document
          .getElementById("next");


      const game=
        document
          .getElementById("game");


      if(

        nextButton &&

        game &&

        !nextButton
          .classList
          .contains("hidden") &&

        !game
          .classList
          .contains("hidden")

      ){

        event.preventDefault();

        nextQuestion();

      }

    }

  }
);



/* =====================================================
   SPUSTENIE
===================================================== */

updateMistakes();

</script>

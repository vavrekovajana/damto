<!DOCTYPE html>

<title>DámTo! – Slová a pravopis</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:16px 18px 30px;
}

.brand{
  text-align:center;
  margin-bottom:14px;
}

.logo{
  font-size:46px;
  font-weight:900;
  letter-spacing:-2px;
}

.logo span{
  color:#ff9f1c;
}

.slogan{
  color:#65758b;
  font-weight:700;
  margin-top:3px;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:26px 30px;
  box-shadow:0 15px 40px rgba(23,54,93,.12);
}

.center{
  text-align:center;
}

.icon{
  font-size:54px;
}

h1{
  margin:8px 0;
  font-size:34px;
}

.subtitle{
  font-size:19px;
  margin-bottom:8px;
}

.small{
  color:#718096;
  font-size:14px;
  line-height:1.5;
}

.levels{
  display:grid;
  gap:10px;
  margin:20px 0;
}

button{
  border:0;
  border-radius:18px;
  padding:14px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  border-color:#ff9f1c;
  background:#fff7e8;
}

.primary{
  background:#2f80ed;
  color:white;
  width:100%;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.mistakes{
  width:100%;
  margin-top:10px;
  background:#fff4df;
  color:#805400;
}

.hidden{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.badge{
  background:#fff4df;
  padding:9px 13px;
  border-radius:30px;
  font-weight:800;
  font-size:14px;
}

.progress{
  height:12px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:14px 0 10px;
}

.bar{
  height:100%;
  width:0;
  background:#ff9f1c;
  transition:.3s;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#65758b;
  font-weight:700;
}

.instruction{
  margin-top:20px;
  color:#65758b;
  font-weight:700;
}

.question{
  font-size:38px;
  font-weight:900;
  margin:18px 0 20px;
  text-align:center;
}

.answers{
  display:grid;
  gap:10px;
}

.answer{
  background:white;
  border:2px solid #dce7f2;
  color:#17365d;
  min-height:58px;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.answer:disabled{
  cursor:default;
}

.feedback{
  margin-top:14px;
  padding:14px;
  border-radius:17px;
  line-height:1.5;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

.next{
  margin-top:12px;
}

.score{
  font-size:58px;
  font-weight:900;
  margin:15px;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:13px;
  margin-top:14px;
}

/* menší notebook */
@media(max-height:800px) and (min-width:521px){
  .wrap{
    padding-top:8px;

    font-size:38px;

  }

  .instruction{
    margin-top:14px;

  .question{
    margin:14px 0 16px;
    font-size:34px;
  }

  .answer{
    min-height:52px;
    padding:12px;
  }

  .progress{
    margin:12px 0 8px;
  }

  .feedback{
    margin-top:10px;
    padding:12px;
  }

  .next{
    margin-top:10px;
  }
}

/* mobil */
@media(max-width:520px){
  .wrap{
    padding:12px 10px 25px;

  .question{
    font-size:29px;
  }

  .logo{
    font-size:40px;
  }

  .icon{
    font-size:48px;
  }

  button{
    padding:13px;
  }
}
</style>

<div class="wrap">

      ⭐ Vybrať level

  </section>

  <div class="footer">

</div>

/* Bezpečnostná kontrola databázy */
const forbiddenWords = new Set(["činel","žiaci","svietiť","variť","hasiť","taniere"]);
const forbiddenDiphthongs = ["ia","ie","iu","ô"];

function isSafeDatabaseItem(item){
  const w=item.word.toLocaleLowerCase("sk");
  return !forbiddenWords.has(w) &&
         !forbiddenDiphthongs.some(d=>w.includes(d));
}

for(let i=database.length-1;i>=0;i--){
  if(!isSafeDatabaseItem(database[i])){
    console.warn("DámTo!: automaticky vyradené slovo:",database[i].word);
    database.splice(i,1);
  }
}

let selectedLevel = 1;
let questions = [];
let current = 0;
let score = 0;
let locked = false;
let mistakesOnly = false;

/*
  Sem si počas jedného tréningu zapisujeme
  už použité vety.

  Tým zabránime opakovaniu tej istej vety.
*/
let usedSentences = new Set();


/* =====================================================
   POMOCNÉ FUNKCIE
   ===================================================== */

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


/*
  Zjednotenie textu pre kontrolu duplicít.

  Rozdiel vo veľkom/malom písmene alebo
  nadbytočných medzerách sa nebude považovať
  za inú vetu.
*/
function normalizeText(text){

  return String(text)
    .trim()
    .replace(/\s+/g," ")
    .toLocaleLowerCase("sk");

}


/*
  Zistí pozíciu písmena, v ktorom sa správne
  a nesprávne slovo líšia.

  napríklad:

  žirafa
  žyrafa

  rozdiel je na pozícii 1
*/
function getDifference(item){

  const good=item.word;
  const bad=item.wrong;

  const length=Math.min(good.length,bad.length);

  for(let i=0;i<length;i++){

    if(
      good[i].toLocaleLowerCase("sk") !==
      bad[i].toLocaleLowerCase("sk")
    ){

      return {
        index:i,
        correctChar:good[i],
        wrongChar:bad[i]
      };

    }

  }

  return null;
}


/*
  VYTVORENIE CHYBNEJ VETY

  Toto je hlavná oprava problému.

  Pôvodný kód hľadal napríklad presne
  slovo "žirafa".

  Preto vo vete:

  "V zoo sme videli žirafu."

  nič nenašiel.

  Nový kód nehľadá celé slovo.
  Nájde charakteristickú časť slova a zmení
  iba konkrétne i/y.

  Preto fungujú aj tvary:

  žirafa
  žirafu

  lipa
  lipou

  cibuľa
  cibuľu
*/
function makeWrongSentence(sentence,item){

  const difference=getDifference(item);

  if(!difference){
    return null;
  }

  const index=difference.index;

  /*
    Vezmeme časť správneho slova okolo
    problematického písmena.

    Napríklad:
    žirafa -> "žira"
    cibuľa -> "cibu"
  */

  const anchorEnd=Math.min(
    item.word.length,
    index+3
  );

  const anchor=item.word.slice(0,anchorEnd);

  const lowerSentence=
    sentence.toLocaleLowerCase("sk");

  const lowerAnchor=
    anchor.toLocaleLowerCase("sk");

  let position=
    lowerSentence.indexOf(lowerAnchor);


  /*
    Ak dlhšiu časť nenájdeme,
    skúsime kratší začiatok slova.
  */

  if(position===-1){

    const shortAnchor=
      item.word.slice(0,index+1);

    position=
      lowerSentence.indexOf(
        shortAnchor.toLocaleLowerCase("sk")
      );

  }


  if(position===-1){
    return null;
  }


  const letterPosition=
    position+index;

  const originalLetter=
    sentence[letterPosition];

  let replacement=
    difference.wrongChar;


  /*
    Zachovanie veľkého písmena.
  */

  if(
    originalLetter ===
    originalLetter.toLocaleUpperCase("sk")
  ){

    replacement=
      replacement.toLocaleUpperCase("sk");

  }


  const result=
    sentence.slice(0,letterPosition)+
    replacement+
    sentence.slice(letterPosition+1);


  /*
    ABSOLÚTNA POISTKA:

    Ak sa veta nezmenila, nepoužijeme ju.
  */

  if(
    normalizeText(result)===
    normalizeText(sentence)
  ){
    return null;
  }


  return result;
}


/*
  Vyberie vetu, ktorá ešte počas tohto
  tréningu nebola použitá.

  Zároveň kontroluje, že sa z nej naozaj
  podarí vytvoriť chybná verzia.
*/
function getUniqueSentence(item){

  const candidates=
    shuffle(item.sentences);

  for(const sentence of candidates){

    const key=normalizeText(sentence);

    if(usedSentences.has(key)){
      continue;
    }

    const bad=
      makeWrongSentence(sentence,item);

    if(!bad){
      continue;
    }

    if(
      normalizeText(sentence)===
      normalizeText(bad)
    ){
      continue;
    }

    usedSentences.add(key);

    return {
      good:sentence,
      bad:bad
    };

  }

  return null;
}


/* =====================================================
   LEVELY A OBRAZOVKY
   ===================================================== */

function chooseLevel(level,button){

  selectedLevel=level;

  document.querySelectorAll(".level")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

}


function show(section){

  ["home","game","finish"].forEach(id=>{

    document
      .getElementById(id)
      .classList.add("hidden");

  });

  document
    .getElementById(section)
    .classList.remove("hidden");

}


/* =====================================================
   UKLADANIE CHÝB
   ===================================================== */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem("damtoMistakes") || "{}"
    );

  }
  catch{

    return {};

  }

}


function saveMistakes(data){

  localStorage.setItem(
    "damtoMistakes",
    JSON.stringify(data)
  );

  updateMistakeCounter();

}


function registerMistake(id){

  const data=getMistakes();

  data[id]=(data[id] || 0)+1;

  saveMistakes(data);

}


function registerCorrect(id){

  const data=getMistakes();

  if(data[id]){

    data[id]--;

    if(data[id]<=0){
      delete data[id];
    }

    saveMistakes(data);

  }

}


function updateMistakeCounter(){

  const total=
    Object.keys(getMistakes()).length;

  document
    .getElementById("mistakeCount")
    .textContent =
      total ? " ("+total+")" : "";

}


/* =====================================================
   TVORBA TRÉNINGU
   ===================================================== */

function buildNormalDeck(){

  const mistakes=getMistakes();

  const soft=database.filter(item=>item.correct==="i" || item.correct==="í");
  const hard=database.filter(item=>item.correct==="y" || item.correct==="ý");

  const softPool=[
    ...shuffle(soft.filter(item=>mistakes[item.id])),
    ...shuffle(soft.filter(item=>!mistakes[item.id]))
  ];

  const hardPool=[
    ...shuffle(hard.filter(item=>mistakes[item.id])),
    ...shuffle(hard.filter(item=>!mistakes[item.id]))
  ];

  return shuffle([
    ...softPool.slice(0,5),
    ...hardPool.slice(0,5)
  ]);
}


function startTraining(){

  mistakesOnly=false;

  /*
    Nový tréning = čistý zoznam
    použitých viet.
  */

  usedSentences=new Set();

  questions=buildNormalDeck();

  current=0;
  score=0;

  show("game");

  renderQuestion();

}


function startMistakes(){

  const stored=getMistakes();

  const wrongWords=
    database.filter(
      item=>stored[item.id]
    );

  if(wrongWords.length===0){

    alert(
      "Zatiaľ nemáš uložené žiadne chyby. 🎉"
    );

    return;

  }

  mistakesOnly=true;

  usedSentences=new Set();

  questions=
    shuffle(wrongWords).slice(0,10);

  current=0;
  score=0;

  show("game");

  renderQuestion();

}


function goHome(){

  updateMistakeCounter();

  show("home");

}


/* =====================================================
   ZOBRAZENIE OTÁZKY
   ===================================================== */

function renderQuestion(){

  locked=false;

  const item=questions[current];

  if(!item){
    finishTraining();
    return;
  }


  document
    .getElementById("counter")
    .textContent =
      (current+1)+" / "+questions.length;


  document
    .getElementById("points")
    .textContent =
      score;


  document
    .getElementById("progressBar")
    .style.width =
      (current/questions.length*100)+"%";


  document
    .getElementById("levelBadge")
    .textContent =
      {
        1:"⭐ Skúšam",
        2:"⭐⭐ Už mi to ide",
        3:"⭐⭐⭐ DámTo!"
      }[selectedLevel];


  const feedback=
    document.getElementById("feedback");

  feedback.className="";
  feedback.innerHTML="";


  document
    .getElementById("nextButton")
    .classList.add("hidden");


  /* LEVEL 1 */

  if(selectedLevel===1){

    document
      .getElementById("instruction")
      .textContent =
        "✏️ Doplň správne písmeno";


    document
      .getElementById("question")
      .textContent =
        item.gap;


    let wrongLetter;

    if(item.correct==="i"){
      wrongLetter="y";
    }
    else if(item.correct==="í"){
      wrongLetter="ý";
    }
    else if(item.correct==="y"){
      wrongLetter="i";
    }
    else{
      wrongLetter="í";
    }


    createAnswers(
      [item.correct,wrongLetter],
      item.correct
    );

    return;

  }


  /* LEVEL 2 */

  if(selectedLevel===2){

    document
      .getElementById("instruction")
      .textContent =
        "🧩 Vyber správne napísané slovo";


    document
      .getElementById("question")
      .textContent =
        "Ktoré slovo je správne?";


    createAnswers(
      [item.word,item.wrong],
      item.word
    );

    return;

  }


  /* LEVEL 3 – LOVEC CHÝB */

  if(selectedLevel===3){

    document
      .getElementById("instruction")
      .textContent =
        "🔎 Lovec chýb";


    document
      .getElementById("question")
      .textContent =
        "Ktorá veta je napísaná správne?";


    const pair=
      getUniqueSentence(item);


    /*
      Ak by sa pri niektorom budúcom slove
      nepodarilo vytvoriť bezpečnú dvojicu,
      otázku preskočíme.

      Nikdy teda nezobrazíme dve
      rovnaké možnosti.
    */

    if(!pair){

      console.warn(
        "DámTo!: nemožno vytvoriť rozdielnu vetu pre",
        item.id
      );

      current++;

      if(current>=questions.length){

        finishTraining();

      }
      else{

        renderQuestion();

      }

      return;

    }


    createAnswers(
      [pair.good,pair.bad],
      pair.good
    );

  }

}


/* =====================================================
   ODPOVEDE
   ===================================================== */

function createAnswers(options,correct){

  const container=
    document.getElementById("answers");

  container.innerHTML="";


  /*
    Odstránenie prípadných duplicít.
  */

  const uniqueOptions=[];

  for(const option of options){

    const exists=
      uniqueOptions.some(
        existing=>
          normalizeText(existing)===
          normalizeText(option)
      );

    if(!exists){
      uniqueOptions.push(option);
    }

  }


  /*
    ĎALŠIA POISTKA:

    Otázka musí mať minimálne dve
    rozdielne odpovede.
  */

  if(uniqueOptions.length<2){

    console.error(
      "DámTo!: zablokované rovnaké odpovede.",
      options
    );

    current++;

    if(current>=questions.length){

      finishTraining();

    }
    else{

      renderQuestion();

    }

    return;

  }


  shuffle(uniqueOptions)
    .forEach(option=>{

      const button=
        document.createElement("button");

      button.className="answer";

      button.textContent=option;

      button.onclick=()=>{

        checkAnswer(
          normalizeText(option)===
          normalizeText(correct)
        );

      };

      container.appendChild(button);

    });

}


/* =====================================================
   VYHODNOTENIE
   ===================================================== */

function checkAnswer(correct){

  if(locked){
    return;
  }

  locked=true;

  const item=
    questions[current];

  const feedback=
    document.getElementById("feedback");


  if(correct){

    score++;

    registerCorrect(item.id);

    feedback.className=
      "feedback good";

    feedback.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    registerMistake(item.id);

    feedback.className=
      "feedback bad";

    feedback.innerHTML=
      "💡 <b>Ešte nie.</b> Správne je <b>"+
      item.word+
      "</b>.<br>"+
      "🎯 Toto slovo si DámTo! zapamätá na ďalšie precvičovanie.";

  }


  document
    .getElementById("points")
    .textContent =
      score;


  document
    .querySelectorAll(".answer")
    .forEach(
      button=>button.disabled=true
    );


  document
    .getElementById("nextButton")
    .classList.remove("hidden");

}


/* =====================================================
   ĎALŠIA OTÁZKA
   ===================================================== */

function nextQuestion(){

  current++;

  if(current>=questions.length){

    finishTraining();

    return;

  }

  renderQuestion();

}


/* =====================================================
   KONIEC TRÉNINGU
   ===================================================== */

function finishTraining(){

  document
    .getElementById("progressBar")
    .style.width="100%";


  document
    .getElementById("finalScore")
    .textContent =
      score+" / "+questions.length;


  let message;

  const percent=
    questions.length
      ? score/questions.length
      : 0;


  if(percent===1){

    message=
      "Perfektné! Bez jedinej chyby. 🌟";

  }
  else if(percent>=0.8){

    message=
      "Výborne! Už si skoro na ďalšom leveli. 🚀";

  }
  else if(percent>=0.6){

    message=
      "Pekná práca. Ešte trochu tréningu a bude to super. 💪";

  }
  else{

    message=
      "Každý tréning sa počíta. Skús ďalší náhodný mix. 🌱";

  }


  document
    .getElementById("finalMessage")
    .textContent =
      message;


  updateMistakeCounter();

  show("finish");

}


/* =====================================================
   SPUSTENIE
   ===================================================== */

updateMistakeCounter();

</script>

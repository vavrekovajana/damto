<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DámTo! – Slová a pravopis</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

button{
  font-family:inherit;
}

.hidden{
  display:none !important;
}

.app{
  width:min(1100px,94%);
  margin:0 auto;
  padding:28px 0 50px;
}

.hero{
  text-align:center;
  margin-bottom:28px;
}

.logo{
  font-size:clamp(46px,8vw,78px);
  font-weight:900;
  color:#17365d;
  letter-spacing:-3px;
  margin:0;
}

.logo span{
  color:#ff9f1c;
}

.subtitle{
  font-size:clamp(18px,3vw,25px);
  margin-top:8px;
  font-weight:700;
  color:#44617f;
}

.card{
  background:white;
  border-radius:28px;
  box-shadow:0 14px 40px rgba(23,54,93,.12);
  padding:28px;
}

.levels{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin:25px 0;
}

.level{
  border:3px solid transparent;
  background:#f7fbff;
  border-radius:24px;
  padding:22px 16px;
  cursor:pointer;
  transition:.2s;
  text-align:center;
  min-height:150px;
}

.level:hover{
  transform:translateY(-3px);
}

.level.active{
  border-color:#ff9f1c;
  background:#fff8e8;
}

.stars{
  font-size:30px;
  margin-bottom:10px;
}

.level h3{
  margin:6px 0;
  font-size:22px;
}

.level p{
  margin:0;
  color:#60758c;
  line-height:1.45;
}

.mainButton{
  width:100%;
  border:0;
  border-radius:18px;
  padding:17px 22px;
  background:#17365d;
  color:white;
  font-size:20px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

.mainButton:hover{
  transform:translateY(-2px);
}

.secondaryButton{
  width:100%;
  border:2px solid #17365d;
  border-radius:18px;
  padding:15px 20px;
  background:white;
  color:#17365d;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  margin-top:12px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.badge{
  background:#fff3d6;
  color:#8a5700;
  padding:9px 14px;
  border-radius:999px;
  font-weight:800;
}

.score{
  font-weight:900;
  font-size:18px;
}

.progress{
  width:100%;
  height:14px;
  background:#e8eef5;
  border-radius:999px;
  overflow:hidden;
  margin:14px 0 26px;
}

.progressBar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#ff9f1c,#ffd166);
  transition:.3s;
}

.instruction{
  text-align:center;
  color:#60758c;
  font-size:18px;
  font-weight:700;
  margin-bottom:10px;
}

.question{
  text-align:center;
  font-size:clamp(30px,6vw,52px);
  font-weight:900;
  margin:20px 0 28px;
  color:#17365d;
}

.answers{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.answer{
  border:3px solid #d9e5f0;
  background:#f9fcff;
  color:#17365d;
  border-radius:20px;
  padding:20px 16px;
  font-size:clamp(20px,3vw,28px);
  font-weight:900;
  cursor:pointer;
  transition:.2s;
}

.answer:hover{
  border-color:#ff9f1c;
  background:#fff8e8;
  transform:translateY(-2px);
}

.answer:disabled{
  cursor:default;
  opacity:.8;
}

.feedback{
  margin-top:22px;
  padding:17px;
  border-radius:18px;
  text-align:center;
  font-size:18px;
  line-height:1.5;
}

.good{
  background:#e8f8ee;
  color:#176b38;
}

.bad{
  background:#fff0ee;
  color:#a13227;
}

.nextButton{
  margin-top:16px;
}

.finish{
  text-align:center;
}

.finishIcon{
  font-size:70px;
}

.finalScore{
  font-size:50px;
  font-weight:900;
  color:#17365d;
  margin:10px 0;
}

.finalMessage{
  font-size:21px;
  color:#60758c;
  margin-bottom:24px;
}

.smallNote{
  text-align:center;
  margin-top:18px;
  color:#70849a;
  font-size:14px;
}

@media(max-width:760px){
  .levels{
    grid-template-columns:1fr;
  }

  .answers{
    grid-template-columns:1fr;
  }

  .card{
    padding:20px;
  }

  .app{
    padding-top:18px;
  }
}
</style>
</head>

<body>

<div class="app">

  <section id="home">

    <div class="hero">
      <h1 class="logo">Dám<span>To!</span></h1>
      <div class="subtitle">
        Trénuj pravopis hravo a bez stresu
      </div>
    </div>

    <div class="card">

      <h2 style="text-align:center;margin-top:0;">
        Vyber si level
      </h2>

      <div class="levels">

        <button
          class="level active"
          onclick="chooseLevel(1,this)"
        >
          <div class="stars">⭐</div>
          <h3>Skúšam</h3>
          <p>
            Doplň správne písmeno
            <b>i / í / y / ý</b>.
          </p>
        </button>

        <button
          class="level"
          onclick="chooseLevel(2,this)"
        >
          <div class="stars">⭐⭐</div>
          <h3>Už mi to ide</h3>
          <p>
            Vyber správne napísané slovo.
          </p>
        </button>

        <button
          class="level"
          onclick="chooseLevel(3,this)"
        >
          <div class="stars">⭐⭐⭐</div>
          <h3>DámTo!</h3>
          <p>
            Staň sa lovcom chýb
            a nájdi správnu vetu.
          </p>
        </button>

      </div>

      <button
        class="mainButton"
        onclick="startTraining()"
      >
        🚀 Spustiť tréning
      </button>

      <button
        class="secondaryButton"
        onclick="startMistakes()"
      >
        🎯 Precvičiť moje chyby
        <span id="mistakeCount"></span>
      </button>

      <div class="smallNote">
        Každý tréning obsahuje náhodný mix úloh.
      </div>

    </div>

  </section>


  <section
    id="game"
    class="hidden"
  >

    <div class="card">

      <div class="topbar">

        <div
          id="levelBadge"
          class="badge"
        >
          ⭐ Skúšam
        </div>

        <div class="score">
          Body:
          <span id="points">0</span>
          &nbsp; • &nbsp;
          <span id="counter">1 / 10</span>
        </div>

      </div>

      <div class="progress">
        <div
          id="progressBar"
          class="progressBar"
        ></div>
      </div>

      <div
        id="instruction"
        class="instruction"
      ></div>

      <div
        id="question"
        class="question"
      ></div>

      <div
        id="answers"
        class="answers"
      ></div>

      <div
        id="feedback"
      ></div>

      <button
        id="nextButton"
        class="mainButton nextButton hidden"
        onclick="nextQuestion()"
      >
        Ďalšia otázka →
      </button>

    </div>

  </section>


  <section
    id="finish"
    class="hidden"
  >

    <div class="card finish">

      <div class="finishIcon">🏆</div>

      <h2>Tréning dokončený!</h2>

      <div
        id="finalScore"
        class="finalScore"
      ></div>

      <div
        id="finalMessage"
        class="finalMessage"
      ></div>

      <button
        class="mainButton"
        onclick="startTraining()"
      >
        🔄 Nový náhodný tréning
      </button>

      <button
        class="secondaryButton"
        onclick="goHome()"
      >
        ← Späť na výber levelu
      </button>

    </div>

  </section>

</div>

const forbiddenWords = new Set([
  "činel",
  "žiaci",
  "svietiť",
  "variť",
  "hasiť",
  "taniere"
]);

const forbiddenDiphthongs = [
  "ia",
  "ie",
  "iu",
  "ô"
];

function isSafeDatabaseItem(item){

  const word =
    item.word.toLocaleLowerCase("sk");

  if(forbiddenWords.has(word)){
    return false;
  }

  if(
    forbiddenDiphthongs.some(
      diphthong =>
        word.includes(diphthong)
    )
  ){
    return false;
  }

  return true;
}


/*
  Ak sa neskôr omylom pridá nevhodné slovo,
  aplikácia ho automaticky vyradí.
*/

for(
  let i = database.length - 1;
  i >= 0;
  i--
){

  if(
    !isSafeDatabaseItem(database[i])
  ){

    console.warn(
      "DámTo!: vyradené slovo:",
      database[i].word
    );

    database.splice(i,1);

  }

}


/* =====================================================

/* =====================================================
   POMOCNÉ FUNKCIE
   ===================================================== */

function shuffle(array){

  const copy = [...array];

  for(
    let i = copy.length - 1;
    i > 0;
    i--
  ){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      copy[i],
      copy[j]
    ] = [
      copy[j],
      copy[i]
    ];

  }

  return copy;
}


function normalizeText(text){

  return String(text)
    .trim()
    .replace(/\s+/g," ")
    .toLocaleLowerCase("sk");

}


/*
  Nájde písmeno,
  v ktorom sa správne a chybné
  slovo líšia.
*/

function getDifference(item){

  const good = item.word;
  const bad = item.wrong;

  const length =
    Math.min(
      good.length,
      bad.length
    );

  for(
    let i = 0;
    i < length;
    i++
  ){

    if(
      good[i]
        .toLocaleLowerCase("sk")
      !==
      bad[i]
        .toLocaleLowerCase("sk")
    ){

      return {
        index:i,
        correctChar:good[i],
        wrongChar:bad[i]
      };

    }

  }

  return null;
}


/* =====================================================
   TVORBA CHYBNEJ VETY
   ===================================================== */

function makeWrongSentence(
  sentence,
  item
){

  const difference =
    getDifference(item);

  if(!difference){
    return null;
  }

  const index =
    difference.index;

  const lowerSentence =
    sentence.toLocaleLowerCase("sk");

  /*
    Skúsime nájsť začiatok slova
    vo vete aj vtedy,
    keď je slovo v inom páde.
  */

  let anchorLength =
    Math.min(
      item.word.length,
      index + 3
    );

  let position = -1;

  while(
    anchorLength > index
    &&
    position === -1
  ){

    const anchor =
      item.word
        .slice(0,anchorLength)
        .toLocaleLowerCase("sk");

    position =
      lowerSentence
        .indexOf(anchor);

    anchorLength--;

  }

  if(position === -1){
    return null;
  }

  const letterPosition =
    position + index;

  const originalLetter =
    sentence[letterPosition];

  let replacement =
    difference.wrongChar;

  /*
    Ak je písmeno veľké,
    zachováme veľkosť.
  */

  if(
    originalLetter
    ===
    originalLetter
      .toLocaleUpperCase("sk")
  ){

    replacement =
      replacement
        .toLocaleUpperCase("sk");

  }

  const result =
    sentence.slice(
      0,
      letterPosition
    )
    +
    replacement
    +
    sentence.slice(
      letterPosition + 1
    );

  /*
    Dve rovnaké vety
    nikdy nepovolíme.
  */

  if(
    normalizeText(result)
    ===
    normalizeText(sentence)
  ){
    return null;
  }

  return result;
}


/* =====================================================
   UNIKÁTNE VETY
   ===================================================== */

function getUniqueSentence(item){

  const candidates =
    shuffle(item.sentences);

  for(
    const sentence
    of candidates
  ){

    const key =
      normalizeText(sentence);

    if(
      usedSentences.has(key)
    ){
      continue;
    }

    const bad =
      makeWrongSentence(
        sentence,
        item
      );

    if(!bad){
      continue;
    }

    if(
      normalizeText(sentence)
      ===
      normalizeText(bad)
    ){
      continue;
    }

    usedSentences.add(key);

    return {
      good:sentence,
      bad:bad
    };

  }

  return null;
}

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "damtoMistakes"
      )
      ||
      "{}"
    );

  }
  catch(error){

    return {};

  }

}


function saveMistakes(data){

  localStorage.setItem(
    "damtoMistakes",
    JSON.stringify(data)
  );

  updateMistakeCounter();

}


function registerMistake(id){

  const data =
    getMistakes();

  data[id] =
    (data[id] || 0) + 1;

  saveMistakes(data);

}


function registerCorrect(id){

  const data =
    getMistakes();

  if(data[id]){

    data[id]--;

    if(
      data[id] <= 0
    ){
      delete data[id];
    }

    saveMistakes(data);

  }

}


function updateMistakeCounter(){

  const total =
    Object.keys(
      getMistakes()
    ).length;

  document
    .getElementById(
      "mistakeCount"
    )
    .textContent =
      total
        ? " (" + total + ")"
        : "";

}


/* =====================================================
   TVORBA TRÉNINGU
   ===================================================== */

function buildNormalDeck(){

  const mistakes =
    getMistakes();

  /*
    Rozdelenie databázy:

    soft = i / í
    hard = y / ý
  */

  const soft =
    database.filter(
      item =>
        item.correct === "i"
        ||
        item.correct === "í"
    );

  const hard =
    database.filter(
      item =>
        item.correct === "y"
        ||
        item.correct === "ý"
    );

  /*
    Chybné slová majú prednosť,
    ale stále zachováme pomer
    5 i/í + 5 y/ý.
  */

  const softMistakes =
    shuffle(
      soft.filter(
        item =>
          mistakes[item.id]
      )
    );

  const hardMistakes =
    shuffle(
      hard.filter(
        item =>
          mistakes[item.id]
      )
    );

  const softOthers =
    shuffle(
      soft.filter(
        item =>
          !mistakes[item.id]
      )
    );

  const hardOthers =
    shuffle(
      hard.filter(
        item =>
          !mistakes[item.id]
      )
    );

  const softPool = [
    ...softMistakes,
    ...softOthers
  ];

  const hardPool = [
    ...hardMistakes,
    ...hardOthers
  ];

  const selectedSoft =
    softPool.slice(0,5);

  const selectedHard =
    hardPool.slice(0,5);

  return shuffle([
    ...selectedSoft,
    ...selectedHard
  ]);

}


/* =====================================================

function startTraining(){

  usedSentences =

  questions =

  usedSentences =

  questions =

  locked = false;

  show("game");

}

function renderQuestion(){

  if(!item){

    .getElementById(

    )

  document
    .getElementById(
      "progressBar"
    )
    .style.width =

        /
        questions.length
        *
        100
      )
      +
      "%";

  document
    .getElementById(
      "levelBadge"
    )
    .textContent =
      {
        1:"⭐ Skúšam",
        2:"⭐⭐ Už mi to ide",
        3:"⭐⭐⭐ DámTo!"
      }[selectedLevel];

  const feedback =
    document
      .getElementById(
        "feedback"
      );

  feedback.className = "";
  feedback.innerHTML = "";

  document
    .getElementById(
      "nextButton"
    )
    .classList
    .add("hidden");


  /* =========================
     LEVEL 1
     ========================= */

  if(
    selectedLevel === 1
  ){

    document
      .getElementById(
        "instruction"
      )
      .textContent =
        "✏️ Doplň správne písmeno";

    document
      .getElementById(
        "question"
      )
      .textContent =
        item.gap;

    let wrongLetter;

    if(
      item.correct === "i"
    ){
      wrongLetter = "y";
    }
    else if(
      item.correct === "í"
    ){
      wrongLetter = "ý";
    }
    else if(
      item.correct === "y"
    ){
      wrongLetter = "i";
    }
    else{
      wrongLetter = "í";
    }

    createAnswers(
      [
        item.correct,
        wrongLetter
      ],
      item.correct
    );

    return;

  }


  /* =========================
     LEVEL 2
     ========================= */

  if(
    selectedLevel === 2
  ){

    document
      .getElementById(
        "instruction"
      )
      .textContent =
        "🧩 Vyber správne napísané slovo";

    document
      .getElementById(
        "question"
      )
      .textContent =
        "Ktoré slovo je správne?";

    createAnswers(
      [
        item.word,
        item.wrong
      ],
      item.word
    );

    return;

  }


  /* =========================
     LEVEL 3
     ========================= */

  if(
    selectedLevel === 3
  ){

    document
      .getElementById(
        "instruction"
      )
      .textContent =
        "🔎 Lovec chýb";

    document
      .getElementById(
        "question"
      )
      .textContent =
        "Ktorá veta je napísaná správne?";

    const pair =
      getUniqueSentence(item);

    /*
      Ak sa z nejakej vety
      nedá bezpečne vytvoriť
      chybná verzia,
      úloha sa preskočí.
    */

    if(!pair){

      current++;

      if(
        current
        >=
        questions.length
      ){

        finishTraining();

      }
      else{

        renderQuestion();

      }

      return;

    }

    createAnswers(
      [
        pair.good,
        pair.bad
      ],
      pair.good
    );

  }

}


/* =====================================================
   ODPOVEDE
   ===================================================== */

function createAnswers(
  options,
  correct
){

  const container =
    document
      .getElementById(
        "answers"
      );

  container.innerHTML = "";

  /*
    Odstránime prípadné
    rovnaké možnosti.
  */

  const unique = [];

  for(
    const option
    of options
  ){

    const alreadyExists =
      unique.some(
        existing =>
          normalizeText(existing)
          ===
          normalizeText(option)
      );

    if(!alreadyExists){
      unique.push(option);
    }

  }

  /*
    Ak nemáme dve rozdielne
    odpovede, otázku preskočíme.
  */

  if(
    unique.length < 2
  ){

    current++;

    if(
      current
      >=
      questions.length
    ){

      finishTraining();

    }
    else{

      renderQuestion();

    }

    return;

  }

  shuffle(unique)
    .forEach(option => {

      const button =
        document
          .createElement(
            "button"
          );

      button.className =
        "answer";

      button.textContent =
        option;

      button.onclick =
        () => {

          checkAnswer(
            normalizeText(option)
            ===
            normalizeText(correct)
          );

        };

      container
        .appendChild(button);

    });

}


/* =====================================================
   KONTROLA ODPOVEDE
   ===================================================== */

function checkAnswer(correct){

  if(locked){
    return;
  }

  locked = true;

  const item =
    questions[current];

  const feedback =
    document
      .getElementById(
        "feedback"
      );


  if(correct){

    score++;

    registerCorrect(
      item.id
    );

    feedback.className =
      "feedback good";

    feedback.innerHTML =
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    registerMistake(
      item.id
    );

    feedback.className =
      "feedback bad";

    feedback.innerHTML =
      "💡 <b>Ešte nie.</b> Správne je <b>"
      +
      item.word
      +
      "</b>.<br>"
      +
      "🎯 Túto chybu si DámTo! zapamätá.";

  }

  document
    .getElementById(
      "points"
    )
    .textContent =
      score;

  document
    .querySelectorAll(
      ".answer"
    )
    .forEach(
      button => {
        button.disabled = true;
      }
    );

  document
    .getElementById(
      "nextButton"
    )
    .classList
    .remove("hidden");

}


/* =====================================================

   ===================================================== */

function nextQuestion(){

  current++;

  if(
    current
    >=
    questions.length
  ){

    finishTraining();

    return;

  }

  renderQuestion();

}


/* =====================================================
   KONIEC
   ===================================================== */

function finishTraining(){

  document
    .getElementById(
      "progressBar"
    )
    .style.width =
      "100%";

  document
    .getElementById(
      "finalScore"
    )
    .textContent =
      score
      +
      " / "
      +
      questions.length;

  const percent =
    questions.length
    ?
    score
    /
    questions.length
    :
    0;

  let message = "";

  if(
    percent === 1
  ){

    message =
      "Perfektné! Bez jedinej chyby. 🌟";

  }
  else if(
    percent >= 0.8
  ){

    message =
      "Výborne! Už ti to naozaj ide. 🚀";

  }
  else if(
    percent >= 0.6
  ){

    message =
      "Pekná práca. Ešte trochu tréningu. 💪";

  }
  else{

    message =
      "Nevadí. Každým pokusom sa zlepšuješ. 🌱";

  }

  document
    .getElementById(
      "finalMessage"
    )
    .textContent =
      message;

  updateMistakeCounter();

  show("finish");

}

<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DámTo! – Slová a pravopis</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

  max-width:760px;
  margin:auto;
  padding:16px 18px 30px;
}

.brand{
  text-align:center;
  margin-bottom:14px;
}

.logo{
  font-size:46px;
  font-weight:900;
  letter-spacing:-2px;
}

.logo span{
  color:#ff9f1c;
}

.slogan{
  color:#65758b;
  font-weight:700;
  margin-top:3px;
}

.card{

}

.center{

}

.icon{

.subtitle{

}

.small{

  font-size:14px;

}

.levels{

}

button{

button:hover{

}

}

.secondary{

}

.mistakes{
  width:100%;
  margin-top:10px;

  color:#805400;
}

.top{

  height:100%;

  color:#65758b;
  font-weight:700;

<body>

<div class="wrap">

  <div class="brand">
    <div class="logo">Dám<span>To!</span></div>
    <div class="slogan">Každý deň o level vyššie.</div>
  </div>


  <!-- DOMOV -->
  <section id="home" class="card center">

    <div class="subtitle">

    </div>

    <p class="small">

      <button class="level active" onclick="chooseLevel(1,this)">

      </button>

      <button class="level" onclick="chooseLevel(2,this)">
        ⭐⭐ Už mi to ide
        <br>
        <span class="small">Vyber správne slovo</span>
      </button>

      <button class="level" onclick="chooseLevel(3,this)">
        ⭐⭐⭐ DámTo!
        <br>
        <span class="small">Nájdi správnu vetu</span>
      </button>

    </div>

    <button class="primary" onclick="startTraining()">
      ▶ Začať tréning
    </button>

    <button class="mistakes" onclick="startMistakes()">
      🎯 Precvičiť moje chyby

    </button>

  </section>


  <!-- HRA -->
  <section id="game" class="card hidden">

    <div class="top">

      <button class="secondary" onclick="goHome()">
        ← Späť
      </button>

      <div id="levelBadge" class="badge"></div>

    </div>

    <div class="progress">
      <div id="progressBar" class="bar"></div>
    </div>

    <div class="stats">
      <span id="counter"></span>
      <span>🏆 <span id="points">0</span></span>
    </div>

    <div id="instruction" class="instruction"></div>

    <div id="question" class="question"></div>

    <div id="answers" class="answers"></div>

    <div id="feedback"></div>

    <button
      id="nextButton"
      class="primary next hidden"

      Ďalej ➜

  </section>


  <!-- VÝSLEDOK -->
  <section id="finish" class="card center hidden">

    <div class="icon">🏆</div>

    <h1>Tréning hotový!</h1>

    <div id="finalScore" class="score"></div>

    <p id="finalMessage"></p>

    <button class="primary" onclick="startTraining()">
      🔄 Nový náhodný mix
    </button>

    <br><br>

    <button class="secondary" onclick="goHome()">
      ⭐ Vybrať level
    </button>

  </section>

  <div class="footer">
    DámTo! • Každý deň o level vyššie.
  </div>

</div>


<script>

/* =====================================================
   DATABÁZA
   ===================================================== */

const database = [

{
  id:"sikovny",
  word:"šikovný",
  wrong:"šykovný",
  gap:"š_kovný",
  correct:"i",
  sentences:[
    "Miško je veľmi šikovný.",
    "Šikovný žiak úlohu vyriešil.",
    "Náš spolužiak je šikovný."
  ]
},

{
  id:"siska",
  word:"šiška",
  wrong:"šyška",
  gap:"š_ška",
  correct:"i",
  sentences:[
    "Pod stromom ležala šiška.",
    "Veverička našla šišku.",
    "Zo stromu spadla šiška."
  ]
},

{
  id:"zirafa",
  word:"žirafa",
  wrong:"žyrafa",
  gap:"ž_rafa",
  correct:"i",
  sentences:[
    "Žirafa má dlhý krk.",
    "V zoo sme videli žirafu.",
    "Žirafa jedla zelené listy."
  ]
},

{
  id:"ziak",
  word:"žiak",
  wrong:"žyak",
  gap:"ž_ak",
  correct:"i",
  sentences:[
    "Žiak sedel v prvej lavici.",
    "Každý žiak dostal zošit.",
    "Žiak správne odpovedal."
  ]
},

{
  id:"cibula",
  word:"cibuľa",
  wrong:"cybuľa",
  gap:"c_buľa",
  correct:"i",
  sentences:[
    "Mama nakrájala cibuľu.",
    "Na stole ležala cibuľa.",
    "Cibuľa má výraznú vôňu."
  ]
},

{
  id:"citron",
  word:"citrón",
  wrong:"cytrón",
  gap:"c_trón",
  correct:"i",
  sentences:[
    "Do čaju som dal citrón.",
    "Citrón chutí kyslo.",
    "Na stole bol žltý citrón."
  ]
},

{
  id:"divadlo",
  word:"divadlo",
  wrong:"dyvadlo",
  gap:"d_vadlo",
  correct:"i",
  sentences:[
    "V sobotu pôjdeme do divadla.",
    "Divadlo uviedlo novú rozprávku.",
    "Pred divadlom čakali deti."
  ]
},

{
  id:"ticho",
  word:"ticho",
  wrong:"tycho",
  gap:"t_cho",
  correct:"i",
  sentences:[
    "V triede bolo ticho.",
    "V lese zavládlo ticho.",
    "Prosím, buď chvíľu ticho."
  ]
},

{
  id:"nitka",
  word:"nitka",
  wrong:"nytka",
  gap:"n_tka",
  correct:"i",
  sentences:[
    "Na stole ležala nitka.",
    "Nitka sa pretrhla.",
    "Navliekla nitku do ihly."
  ]
},

{
  id:"nikto",
  word:"nikto",
  wrong:"nykto",
  gap:"n_kto",
  correct:"i",
  sentences:[
    "Nikto dnes nechýbal.",
    "Nikto nepoznal odpoveď.",
    "Nikto nechcel odísť."
  ]
},

{
  id:"lipa",
  word:"lipa",
  wrong:"lypa",
  gap:"l_pa",
  correct:"i",
  sentences:[
    "Pred domom rastie lipa.",
    "Lipa krásne kvitne.",
    "Pod lipou sme oddychovali."
  ]
},

{
  id:"list",
  word:"list",
  wrong:"lyst",
  gap:"l_st",
  correct:"i",
  sentences:[
    "Zo stromu spadol list.",
    "Na zemi ležal žltý list.",
    "Vietor odniesol suchý list."
  ]
}

];


/* =====================================================
   PREMENNÉ
   ===================================================== */

let selectedLevel = 1;
let questions = [];
let current = 0;
let score = 0;
let locked = false;
let mistakesOnly = false;

/*
  Sem si počas jedného tréningu zapisujeme
  už použité vety.

  Tým zabránime opakovaniu tej istej vety.
*/
let usedSentences = new Set();


/* =====================================================
   POMOCNÉ FUNKCIE
   ===================================================== */

function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


/*
  Zjednotenie textu pre kontrolu duplicít.

  Rozdiel vo veľkom/malom písmene alebo
  nadbytočných medzerách sa nebude považovať
  za inú vetu.
*/
function normalizeText(text){

  return String(text)
    .trim()
    .replace(/\s+/g," ")
    .toLocaleLowerCase("sk");

}


/*
  Zistí pozíciu písmena, v ktorom sa správne
  a nesprávne slovo líšia.

  napríklad:

  žirafa
  žyrafa

  rozdiel je na pozícii 1
*/
function getDifference(item){

  const good=item.word;
  const bad=item.wrong;

  const length=Math.min(good.length,bad.length);

  for(let i=0;i<length;i++){

    if(
      good[i].toLocaleLowerCase("sk") !==
      bad[i].toLocaleLowerCase("sk")
    ){

      return {
        index:i,
        correctChar:good[i],
        wrongChar:bad[i]
      };

    }

  }

  return null;
}


/*
  VYTVORENIE CHYBNEJ VETY

  Toto je hlavná oprava problému.

  Pôvodný kód hľadal napríklad presne
  slovo "žirafa".

  Preto vo vete:

  "V zoo sme videli žirafu."

  nič nenašiel.

  Nový kód nehľadá celé slovo.
  Nájde charakteristickú časť slova a zmení
  iba konkrétne i/y.

  Preto fungujú aj tvary:

  žirafa
  žirafu

  lipa
  lipou

  cibuľa
  cibuľu
*/
function makeWrongSentence(sentence,item){

  const difference=getDifference(item);

  if(!difference){
    return null;
  }

  const index=difference.index;

  /*
    Vezmeme časť správneho slova okolo
    problematického písmena.

    Napríklad:
    žirafa -> "žira"
    cibuľa -> "cibu"
  */

  const anchorEnd=Math.min(
    item.word.length,
    index+3
  );

  const anchor=item.word.slice(0,anchorEnd);

  const lowerSentence=
    sentence.toLocaleLowerCase("sk");

  const lowerAnchor=
    anchor.toLocaleLowerCase("sk");

  let position=
    lowerSentence.indexOf(lowerAnchor);


  /*
    Ak dlhšiu časť nenájdeme,
    skúsime kratší začiatok slova.
  */

  if(position===-1){

    const shortAnchor=
      item.word.slice(0,index+1);

    position=
      lowerSentence.indexOf(
        shortAnchor.toLocaleLowerCase("sk")
      );

  }


  if(position===-1){
    return null;
  }


  const letterPosition=
    position+index;

  const originalLetter=
    sentence[letterPosition];

  let replacement=
    difference.wrongChar;


  /*
    Zachovanie veľkého písmena.
  */

  if(
    originalLetter ===
    originalLetter.toLocaleUpperCase("sk")
  ){

    replacement=
      replacement.toLocaleUpperCase("sk");

  }


  const result=
    sentence.slice(0,letterPosition)+
    replacement+
    sentence.slice(letterPosition+1);


  /*
    ABSOLÚTNA POISTKA:

    Ak sa veta nezmenila, nepoužijeme ju.
  */

  if(
    normalizeText(result)===
    normalizeText(sentence)
  ){
    return null;
  }


  return result;
}


/*
  Vyberie vetu, ktorá ešte počas tohto
  tréningu nebola použitá.

  Zároveň kontroluje, že sa z nej naozaj
  podarí vytvoriť chybná verzia.
*/
function getUniqueSentence(item){

  const candidates=
    shuffle(item.sentences);

  for(const sentence of candidates){

    const key=normalizeText(sentence);

    if(usedSentences.has(key)){
      continue;
    }

    const bad=
      makeWrongSentence(sentence,item);

    if(!bad){
      continue;
    }

    if(
      normalizeText(sentence)===
      normalizeText(bad)
    ){
      continue;
    }

    usedSentences.add(key);

    return {
      good:sentence,
      bad:bad
    };

  }

  return null;
}


/* =====================================================
   LEVELY A OBRAZOVKY
   ===================================================== */

function chooseLevel(level,button){

  selectedLevel=level;

  document.querySelectorAll(".level")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

}


function show(section){

  ["home","game","finish"].forEach(id=>{

    document
      .getElementById(id)
      .classList.add("hidden");

  });

  document
    .getElementById(section)
    .classList.remove("hidden");

}


/* =====================================================
   UKLADANIE CHÝB
   ===================================================== */

function getMistakes(){

  try{

    return JSON.parse(
      localStorage.getItem("damtoMistakes") || "{}"
    );

  }
  catch{

    return {};

  }

}


function saveMistakes(data){

  localStorage.setItem(
    "damtoMistakes",
    JSON.stringify(data)
  );

  updateMistakeCounter();

}


function registerMistake(id){

  const data=getMistakes();

  data[id]=(data[id] || 0)+1;

  saveMistakes(data);

}


function registerCorrect(id){

  const data=getMistakes();

  if(data[id]){

    data[id]--;

    if(data[id]<=0){
      delete data[id];
    }

    saveMistakes(data);

  }

}


function updateMistakeCounter(){

  const total=
    Object.keys(getMistakes()).length;

  document
    .getElementById("mistakeCount")
    .textContent =
      total ? " ("+total+")" : "";

}


/* =====================================================
   TVORBA TRÉNINGU
   ===================================================== */

function buildNormalDeck(){

  const mistakes=getMistakes();

  const difficult=
    database.filter(
      item=>mistakes[item.id]
    );

  const others=
    database.filter(
      item=>!mistakes[item.id]
    );

  /*
    Každé slovo je v databáze iba raz.

    Preto sa v jednom tréningu
    to isté slovo nezopakuje.
  */

  const deck=[
    ...shuffle(difficult),
    ...shuffle(others)
  ];

  return deck.slice(0,10);

}


function startTraining(){

  mistakesOnly=false;

  /*
    Nový tréning = čistý zoznam
    použitých viet.
  */

  usedSentences=new Set();

  questions=buildNormalDeck();

  current=0;
  score=0;

  show("game");

  renderQuestion();

}


function startMistakes(){

  const stored=getMistakes();

  const wrongWords=
    database.filter(
      item=>stored[item.id]
    );

  if(wrongWords.length===0){

    alert(
      "Zatiaľ nemáš uložené žiadne chyby. 🎉"
    );

    return;

  }

  mistakesOnly=true;

  usedSentences=new Set();

  questions=
    shuffle(wrongWords).slice(0,10);

  current=0;
  score=0;

  show("game");

  renderQuestion();

}


function goHome(){

  updateMistakeCounter();

  show("home");

}


/* =====================================================
   ZOBRAZENIE OTÁZKY
   ===================================================== */

function renderQuestion(){

  locked=false;

  const item=questions[current];

  if(!item){
    finishTraining();
    return;
  }


  document
    .getElementById("counter")
    .textContent =
      (current+1)+" / "+questions.length;


  document
    .getElementById("points")
    .textContent =
      score;


  document
    .getElementById("progressBar")
    .style.width =
      (current/questions.length*100)+"%";


  document
    .getElementById("levelBadge")
    .textContent =
      {
        1:"⭐ Skúšam",
        2:"⭐⭐ Už mi to ide",
        3:"⭐⭐⭐ DámTo!"
      }[selectedLevel];


  const feedback=
    document.getElementById("feedback");

  feedback.className="";
  feedback.innerHTML="";


  document
    .getElementById("nextButton")
    .classList.add("hidden");


  /* LEVEL 1 */

  if(selectedLevel===1){

    document
      .getElementById("instruction")
      .textContent =
        "✏️ Doplň správne písmeno";


    document
      .getElementById("question")
      .textContent =
        item.gap;


    let wrongLetter;

    if(item.correct==="i"){
      wrongLetter="y";
    }
    else if(item.correct==="í"){
      wrongLetter="ý";
    }
    else if(item.correct==="y"){
      wrongLetter="i";
    }
    else{
      wrongLetter="í";
    }


    createAnswers(
      [item.correct,wrongLetter],
      item.correct
    );

    return;

  }


  /* LEVEL 2 */

  if(selectedLevel===2){

    document
      .getElementById("instruction")
      .textContent =
        "🧩 Vyber správne napísané slovo";


    document
      .getElementById("question")
      .textContent =
        "Ktoré slovo je správne?";


    createAnswers(
      [item.word,item.wrong],
      item.word
    );

    return;

  }


  /* LEVEL 3 – LOVEC CHÝB */

  if(selectedLevel===3){

    document
      .getElementById("instruction")
      .textContent =
        "🔎 Lovec chýb";


    document
      .getElementById("question")
      .textContent =
        "Ktorá veta je napísaná správne?";


    const pair=
      getUniqueSentence(item);


    /*
      Ak by sa pri niektorom budúcom slove
      nepodarilo vytvoriť bezpečnú dvojicu,
      otázku preskočíme.

      Nikdy teda nezobrazíme dve
      rovnaké možnosti.
    */

    if(!pair){

      console.warn(
        "DámTo!: nemožno vytvoriť rozdielnu vetu pre",
        item.id
      );

      current++;

      if(current>=questions.length){

        finishTraining();

      }
      else{

        renderQuestion();

      }

      return;

    }


    createAnswers(
      [pair.good,pair.bad],
      pair.good
    );

  }

}


/* =====================================================
   ODPOVEDE
   ===================================================== */

function createAnswers(options,correct){

  const container=
    document.getElementById("answers");

  container.innerHTML="";


  /*
    Odstránenie prípadných duplicít.
  */

  const uniqueOptions=[];

  for(const option of options){

    const exists=
      uniqueOptions.some(
        existing=>
          normalizeText(existing)===
          normalizeText(option)
      );

    if(!exists){
      uniqueOptions.push(option);
    }

  }


  /*
    ĎALŠIA POISTKA:

    Otázka musí mať minimálne dve
    rozdielne odpovede.
  */

  if(uniqueOptions.length<2){

    console.error(
      "DámTo!: zablokované rovnaké odpovede.",
      options
    );

    current++;

    if(current>=questions.length){

      finishTraining();

    }
    else{

      renderQuestion();

    }

    return;

  }


  shuffle(uniqueOptions)
    .forEach(option=>{

      const button=
        document.createElement("button");

      button.className="answer";

      button.textContent=option;

      button.onclick=()=>{

        checkAnswer(
          normalizeText(option)===
          normalizeText(correct)
        );

      };

      container.appendChild(button);

    });

}


/* =====================================================
   VYHODNOTENIE
   ===================================================== */

function checkAnswer(correct){

  if(locked){
    return;
  }

  locked=true;

  const item=
    questions[current];

  const feedback=
    document.getElementById("feedback");


  if(correct){

    score++;

    registerCorrect(item.id);

    feedback.className=
      "feedback good";

    feedback.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    registerMistake(item.id);

    feedback.className=
      "feedback bad";

    feedback.innerHTML=
      "💡 <b>Ešte nie.</b> Správne je <b>"+
      item.word+
      "</b>.<br>"+
      "🎯 Toto slovo si DámTo! zapamätá na ďalšie precvičovanie.";

  }


  document
    .getElementById("points")
    .textContent =
      score;


  document
    .querySelectorAll(".answer")
    .forEach(
      button=>button.disabled=true
    );


  document
    .getElementById("nextButton")
    .classList.remove("hidden");

}


/* =====================================================
   ĎALŠIA OTÁZKA
   ===================================================== */

function nextQuestion(){

  current++;

  if(current>=questions.length){

    finishTraining();

    return;

  }

  renderQuestion();

}


/* =====================================================
   KONIEC TRÉNINGU
   ===================================================== */

function finishTraining(){

  document
    .getElementById("progressBar")
    .style.width="100%";


  document
    .getElementById("finalScore")
    .textContent =
      score+" / "+questions.length;


  let message;

  const percent=
    questions.length
      ? score/questions.length
      : 0;


  if(percent===1){

    message=
      "Perfektné! Bez jedinej chyby. 🌟";

  }
  else if(percent>=0.8){

    message=
      "Výborne! Už si skoro na ďalšom leveli. 🚀";

  }
  else if(percent>=0.6){

    message=
      "Pekná práca. Ešte trochu tréningu a bude to super. 💪";

  }
  else{

    message=
      "Každý tréning sa počíta. Skús ďalší náhodný mix. 🌱";

  }


  document
    .getElementById("finalMessage")
    .textContent =
      message;


  updateMistakeCounter();

  show("finish");

}


/* =====================================================
   SPUSTENIE
   ===================================================== */

updateMistakeCounter();

</script>

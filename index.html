<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DámTo! – Slová a pravopis</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:24px 18px 50px;
}

.brand{
  text-align:center;
  margin-bottom:20px;
}

.logo{
  font-size:46px;
  font-weight:900;
  letter-spacing:-2px;
}

.logo span{color:#ff9f1c}

.slogan{
  color:#65758b;
  font-weight:700;
  margin-top:3px;
}

.card{
  background:#fff;
  border-radius:30px;
  padding:30px;
  box-shadow:0 15px 40px rgba(23,54,93,.12);
}

.center{text-align:center}

.icon{font-size:60px}

h1{
  margin:10px 0;
  font-size:34px;
}

.subtitle{
  font-size:19px;
  margin-bottom:8px;
}

.small{
  color:#718096;
  font-size:14px;
  line-height:1.5;
}

.levels{
  display:grid;
  gap:12px;
  margin:25px 0;
}

button{
  border:0;
  border-radius:18px;
  padding:16px;
  font-size:17px;
  font-weight:800;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  border-color:#ff9f1c;
  background:#fff7e8;
}

.primary{
  background:#2f80ed;
  color:white;
  width:100%;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.mistakes{
  width:100%;
  margin-top:12px;
  background:#fff4df;
  color:#805400;
}

.hidden{display:none}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.badge{
  background:#fff4df;
  padding:9px 13px;
  border-radius:30px;
  font-weight:800;
  font-size:14px;
}

.progress{
  height:12px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:20px 0 12px;
}

.bar{
  height:100%;
  width:0;
  background:#ff9f1c;
  transition:.3s;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#65758b;
  font-weight:700;
}

.instruction{
  margin-top:30px;
  color:#65758b;
  font-weight:700;
}

.question{
  font-size:38px;
  font-weight:900;
  margin:22px 0 25px;
  text-align:center;
}

.answers{
  display:grid;
  gap:12px;
}

.answer{
  background:white;
  border:2px solid #dce7f2;
  color:#17365d;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.answer:disabled{
  cursor:default;
}

.feedback{
  margin-top:20px;
  padding:16px;
  border-radius:17px;
  line-height:1.5;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

.next{
  margin-top:16px;
}

.score{
  font-size:58px;
  font-weight:900;
  margin:15px;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:13px;
  margin-top:20px;
}

@media(max-width:520px){
  .card{padding:22px 17px}
  h1{font-size:29px}
  .question{font-size:31px}
  .logo{font-size:40px}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="brand">
    <div class="logo">Dám<span>To!</span></div>
    <div class="slogan">Každý deň o level vyššie.</div>
  </div>

  <!-- DOMOV -->
  <section id="home" class="card center">

    <div class="icon">🔤</div>

    <h1>Slová a pravopis</h1>

    <div class="subtitle">
      <b>Tvrdé a mäkké spoluhlásky</b>
    </div>

    <p class="small">
      Vyber si level. Otázky sa pri každom tréningu premiešajú.
      Chybné odpovede si aplikácia zapamätá a môžeš si ich precvičiť znova.
    </p>

    <div class="levels">

      <button class="level active" onclick="chooseLevel(1,this)">
        ⭐ Skúšam
        <br>
        <span class="small">Doplň správne písmeno</span>
      </button>

      <button class="level" onclick="chooseLevel(2,this)">
        ⭐⭐ Už mi to ide
        <br>
        <span class="small">Vyber správne slovo</span>
      </button>

      <button class="level" onclick="chooseLevel(3,this)">
        ⭐⭐⭐ DámTo!
        <br>
        <span class="small">Nájdi správnu vetu</span>
      </button>

    </div>

    <button class="primary" onclick="startTraining()">
      ▶ Začať tréning
    </button>

    <button class="mistakes" onclick="startMistakes()">
      🎯 Precvičiť moje chyby
      <span id="mistakeCount"></span>
    </button>

  </section>


  <!-- HRA -->
  <section id="game" class="card hidden">

    <div class="top">

      <button class="secondary" onclick="goHome()">
        ← Späť
      </button>

      <div id="levelBadge" class="badge"></div>

    </div>

    <div class="progress">
      <div id="progressBar" class="bar"></div>
    </div>

    <div class="stats">
      <span id="counter"></span>
      <span>🏆 <span id="points">0</span></span>
    </div>

    <div id="instruction" class="instruction"></div>

    <div id="question" class="question"></div>

    <div id="answers" class="answers"></div>

    <div id="feedback"></div>

    <button id="nextButton"
            class="primary next hidden"
            onclick="nextQuestion()">
      Ďalej ➜
    </button>

  </section>


  <!-- VÝSLEDOK -->
  <section id="finish" class="card center hidden">

    <div class="icon">🏆</div>

    <h1>Tréning hotový!</h1>

    <div id="finalScore" class="score"></div>

    <p id="finalMessage"></p>

    <button class="primary" onclick="startTraining()">
      🔄 Nový náhodný mix
    </button>

    <br><br>

    <button class="secondary" onclick="goHome()">
      ⭐ Vybrať level
    </button>

  </section>

  <div class="footer">
    DámTo! • Každý deň o level vyššie.
  </div>

</div>


<script>

/*
  PRVÁ TESTOVACIA DATABÁZA

  Toto je technický základ aplikácie.
  Databázu budeme následne rozširovať
  podľa učiva, ktoré dodáš.
*/

const database = [

{
 id:"sikovny",
 word:"šikovný",
 wrong:"šykovný",
 gap:"š_kovný",
 correct:"i",
 sentences:[
  "Miško je veľmi šikovný.",
  "Šikovný žiak úlohu vyriešil.",
  "Náš spolužiak je šikovný."
 ]
},

{
 id:"siska",
 word:"šiška",
 wrong:"šyška",
 gap:"š_ška",
 correct:"i",
 sentences:[
  "Pod stromom ležala šiška.",
  "Veverička našla šišku.",
  "Zo stromu spadla šiška."
 ]
},

{
 id:"zirafa",
 word:"žirafa",
 wrong:"žyrafa",
 gap:"ž_rafa",
 correct:"i",
 sentences:[
  "Žirafa má dlhý krk.",
  "V zoo sme videli žirafu.",
  "Žirafa jedla zelené listy."
 ]
},

{
 id:"ziak",
 word:"žiak",
 wrong:"žyak",
 gap:"ž_ak",
 correct:"i",
 sentences:[
  "Žiak sedel v prvej lavici.",
  "Každý žiak dostal zošit.",
  "Žiak správne odpovedal."
 ]
},

{
 id:"cibula",
 word:"cibuľa",
 wrong:"cybuľa",
 gap:"c_buľa",
 correct:"i",
 sentences:[
  "Mama nakrájala cibuľu.",
  "Na stole ležala cibuľa.",
  "Cibuľa má výraznú vôňu."
 ]
},

{
 id:"citron",
 word:"citrón",
 wrong:"cytrón",
 gap:"c_trón",
 correct:"i",
 sentences:[
  "Do čaju som dal citrón.",
  "Citrón chutí kyslo.",
  "Na stole bol žltý citrón."
 ]
},

{
 id:"divadlo",
 word:"divadlo",
 wrong:"dyvadlo",
 gap:"d_vadlo",
 correct:"i",
 sentences:[
  "V sobotu pôjdeme do divadla.",
  "Divadlo uviedlo novú rozprávku.",
  "Pred divadlom čakali deti."
 ]
},

{
 id:"ticho",
 word:"ticho",
 wrong:"tycho",
 gap:"t_cho",
 correct:"i",
 sentences:[
  "V triede bolo ticho.",
  "V lese zavládlo ticho.",
  "Prosím, buď chvíľu ticho."
 ]
},

{
 id:"nitka",
 word:"nitka",
 wrong:"nytka",
 gap:"n_tka",
 correct:"i",
 sentences:[
  "Na stole ležala nitka.",
  "Nitka sa pretrhla.",
  "Navliekla nitku do ihly."
 ]
},

{
 id:"nikto",
 word:"nikto",
 wrong:"nykto",
 gap:"n_kto",
 correct:"i",
 sentences:[
  "Nikto dnes nechýbal.",
  "Nikto nepoznal odpoveď.",
  "Nikto nechcel odísť."
 ]
},

{
 id:"lipa",
 word:"lipa",
 wrong:"lypa",
 gap:"l_pa",
 correct:"i",
 sentences:[
  "Pred domom rastie lipa.",
  "Lipa krásne kvitne.",
  "Pod lipou sme oddychovali."
 ]
},

{
 id:"list",
 word:"list",
 wrong:"lyst",
 gap:"l_st",
 correct:"i",
 sentences:[
  "Zo stromu spadol list.",
  "Na zemi ležal žltý list.",
  "Vietor odniesol suchý list."
 ]
}

];


let selectedLevel = 1;
let questions = [];
let current = 0;
let score = 0;
let locked = false;
let mistakesOnly = false;


function shuffle(array){

  const a=[...array];

  for(let i=a.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [a[i],a[j]]=[a[j],a[i]];

  }

  return a;
}


function chooseLevel(level,button){

  selectedLevel=level;

  document.querySelectorAll(".level")
    .forEach(x=>x.classList.remove("active"));

  button.classList.add("active");

}


function show(section){

  ["home","game","finish"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });

  document.getElementById(section).classList.remove("hidden");

}


function getMistakes(){

  try{
    return JSON.parse(
      localStorage.getItem("damtoMistakes") || "{}"
    );
  }
  catch{
    return {};
  }

}


function saveMistakes(data){

  localStorage.setItem(
    "damtoMistakes",
    JSON.stringify(data)
  );

  updateMistakeCounter();

}


function registerMistake(id){

  const data=getMistakes();

  data[id]=(data[id] || 0)+1;

  saveMistakes(data);

}


function registerCorrect(id){

  const data=getMistakes();

  if(data[id]){

    data[id]--;

    if(data[id]<=0){
      delete data[id];
    }

    saveMistakes(data);
  }

}


function updateMistakeCounter(){

  const total=Object.keys(getMistakes()).length;

  document.getElementById("mistakeCount").textContent =
    total ? " ("+total+")" : "";

}


function buildNormalDeck(){

  const mistakes=getMistakes();

  const difficult=database.filter(
    item=>mistakes[item.id]
  );

  const others=database.filter(
    item=>!mistakes[item.id]
  );

  let deck=[
    ...shuffle(difficult),
    ...shuffle(others)
  ];

  /*
    maximálne 10 rôznych slov v jednom tréningu
  */

  return deck.slice(0,10);

}


function startTraining(){

  mistakesOnly=false;

  questions=buildNormalDeck();

  current=0;
  score=0;

  show("game");

  renderQuestion();

}


function startMistakes(){

  const stored=getMistakes();

  const wrongWords=database.filter(
    item=>stored[item.id]
  );

  if(wrongWords.length===0){

    alert(
      "Zatiaľ nemáš uložené žiadne chyby. 🎉"
    );

    return;
  }

  mistakesOnly=true;

  questions=shuffle(wrongWords).slice(0,10);

  current=0;
  score=0;

  show("game");

  renderQuestion();

}


function goHome(){

  updateMistakeCounter();

  show("home");

}


function renderQuestion(){

  locked=false;

  const item=questions[current];

  document.getElementById("counter").textContent =
    (current+1)+" / "+questions.length;

  document.getElementById("points").textContent =
    score;

  document.getElementById("progressBar").style.width =
    (current/questions.length*100)+"%";

  document.getElementById("levelBadge").textContent =
    {
      1:"⭐ Skúšam",
      2:"⭐⭐ Už mi to ide",
      3:"⭐⭐⭐ DámTo!"
    }[selectedLevel];

  const feedback=document.getElementById("feedback");

  feedback.className="";
  feedback.innerHTML="";

  document.getElementById("nextButton")
    .classList.add("hidden");


  if(selectedLevel===1){

    document.getElementById("instruction").textContent =
      "✏️ Doplň správne písmeno";

    document.getElementById("question").textContent =
      item.gap;

    let wrongLetter;

    if(item.correct==="i") wrongLetter="y";
    else if(item.correct==="í") wrongLetter="ý";
    else if(item.correct==="y") wrongLetter="i";
    else wrongLetter="í";

    createAnswers(
      [item.correct,wrongLetter],
      item.correct
    );

  }


  if(selectedLevel===2){

    document.getElementById("instruction").textContent =
      "🧩 Vyber správne napísané slovo";

    document.getElementById("question").textContent =
      "Ktoré slovo je správne?";

    createAnswers(
      [item.word,item.wrong],
      item.word
    );

  }


  if(selectedLevel===3){

    document.getElementById("instruction").textContent =
      "🔎 Lovec chýb";

    document.getElementById("question").textContent =
      "Ktorá veta je napísaná správne?";

    const good=
      shuffle(item.sentences)[0];

    /*
      vytvoríme nesprávnu vetu
      nahradením správneho slova
    */

    const bad=
      good.replace(item.word,item.wrong);

    createAnswers(
      [good,bad],
      good
    );

  }

}


function createAnswers(options,correct){

  const container=
    document.getElementById("answers");

  container.innerHTML="";

  shuffle(options).forEach(option=>{

    const button=
      document.createElement("button");

    button.className="answer";

    button.textContent=option;

    button.onclick=()=>checkAnswer(
      option===correct
    );

    container.appendChild(button);

  });

}


function checkAnswer(correct){

  if(locked) return;

  locked=true;

  const item=questions[current];

  const feedback=
    document.getElementById("feedback");


  if(correct){

    score++;

    registerCorrect(item.id);

    feedback.className="feedback good";

    feedback.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }

  else{

    registerMistake(item.id);

    feedback.className="feedback bad";

    feedback.innerHTML=
      "💡 <b>Ešte nie.</b> Správne je <b>"+
      item.word+
      "</b>.<br>🎯 Toto slovo si DámTo! zapamätá na ďalšie precvičovanie.";

  }


  document.getElementById("points").textContent =
    score;

  document.querySelectorAll(".answer")
    .forEach(button=>button.disabled=true);

  document.getElementById("nextButton")
    .classList.remove("hidden");

}


function nextQuestion(){

  current++;

  if(current>=questions.length){

    finishTraining();

    return;

  }

  renderQuestion();

}


function finishTraining(){

  document.getElementById("finalScore").textContent =
    score+" / "+questions.length;

  let message;

  const percent=
    score/questions.length;


  if(percent===1){

    message=
      "Perfektné! Bez jedinej chyby. 🌟";

  }

  else if(percent>=0.8){

    message=
      "Výborne! Už si skoro na ďalšom leveli. 🚀";

  }

  else if(percent>=0.6){

    message=
      "Pekná práca. Ešte trochu tréningu a bude to super. 💪";

  }

  else{

    message=
      "Každý tréning sa počíta. Skús ďalší náhodný mix. 🌱";

  }

  document.getElementById("finalMessage").textContent =
    message;

  show("finish");

}


updateMistakeCounter();

</script>

</body>
</html>

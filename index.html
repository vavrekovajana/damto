<!DOCTYPE html>
<html lang="sk">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DámTo! – Slová a pravopis</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef7ff,#fff5df);
  color:#17365d;
  min-height:100vh;
}

.wrap{
  max-width:760px;
  margin:auto;
  padding:5px;
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  line-height:1;
}

.logo span{
  color:#ff9f1c;
}

.slogan{
  text-align:center;
  color:#718096;
  font-weight:700;
  font-size:11px;
  margin:2px 0 5px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:10px;
  box-shadow:0 10px 28px rgba(23,54,93,.12);
}

.center{text-align:center}
.hidden{display:none!important}

.levels{
  display:grid;
  gap:5px;
  margin:8px 0;
}

button{
  border:0;
  border-radius:13px;
  padding:8px;
  font-size:14px;
  font-weight:800;
  cursor:pointer;
  font-family:Arial,sans-serif;
}

.level{
  background:#eef6ff;
  color:#17365d;
  border:2px solid transparent;
}

.level.active{
  border-color:#ff9f1c;
  background:#fff7e8;
}

.primary{
  width:100%;
  background:#2f80ed;
  color:#fff;
}

.secondary{
  background:#eef6ff;
  color:#17365d;
}

.mistakes{
  width:100%;
  margin-top:5px;
  background:#fff4df;
  color:#805400;
}

.allExercises{
  background:#fff4df;
  color:#805400;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:5px;
}

.navButtons{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.badge{
  background:#fff4df;
  padding:6px 9px;
  border-radius:30px;
  font-weight:800;
  font-size:12px;
}

.progress{
  height:6px;
  background:#e9eff5;
  border-radius:20px;
  overflow:hidden;
  margin:5px 0;
}

.bar{
  height:100%;
  width:0;
  background:#ff9f1c;
}

.stats{
  display:flex;
  justify-content:space-between;
  color:#65758b;
  font-size:12px;
  font-weight:700;
}

.instruction{
  margin-top:5px;
  color:#65758b;
  font-size:14px;
  font-weight:800;
  text-align:center;
}

.question{
  text-align:center;
  font-size:30px;
  font-weight:900;
  margin:7px 0;
  line-height:1.15;
}

.answers{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
}

.answer{
  background:#fff;
  border:2px solid #dce7f2;
  color:#17365d;
}

.answer:hover{
  border-color:#2f80ed;
  background:#f5f9ff;
}

.answer.keyboardSelected{
  border-color:#2f80ed;
  background:#eaf3ff;
  box-shadow:0 0 0 2px rgba(47,128,237,.12);
}

.feedback{
  margin-top:5px;
  padding:5px 7px;
  border-radius:10px;
  font-size:12px;
}

.good{
  background:#e9f8ef;
  color:#176b46;
}

.bad{
  background:#fff0f2;
  color:#9f3047;
}

.score{
  font-size:44px;
  font-weight:900;
  margin:6px;
}

.footer{
  text-align:center;
  color:#8795a7;
  font-size:10px;
  margin-top:3px;
}

#next{
  margin-top:5px!important;
}

@media(max-height:700px){
  .wrap{padding:4px}
  .logo{font-size:25px}
  .slogan{font-size:9px;margin:1px 0 3px}

  button{padding:6px;font-size:12px}
  .levels{gap:4px;margin:5px 0}
  .instruction{margin-top:3px;font-size:12px}
  .question{font-size:25px;margin:5px 0}
  .answers{gap:4px}
  .answer{padding:6px;font-size:12px}
  .feedback{padding:4px;font-size:11px}
  .progress{margin:3px 0}
}

@media(max-width:520px){
  .wrap{padding:4px}
  .logo{font-size:27px}
  .question{font-size:24px}
  .navButtons button{font-size:10px;padding:5px}
  .badge{font-size:10px;padding:5px 7px}
}
</style>

/* =====================================================
   NÁHODNÉ PORADIE
===================================================== */

function shuffle(a){
  a=[...a];

  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }

  return a;
}


/* =====================================================
   VÝBER LEVELU
===================================================== */

function chooseLevel(n,btn){
  level=n;

  document
  .querySelectorAll(".level")
  .forEach(b=>b.classList.remove("active"));

  btn.classList.add("active");
}


/* =====================================================
   PREPÍNANIE OBRAZOVIEK
===================================================== */

function show(id){

  ["home","game","finish"]
  .forEach(x=>{
    document
    .getElementById(x)
    .classList
    .add("hidden");
  });

  document
  .getElementById(id)
  .classList
  .remove("hidden");

  window.scrollTo(0,0);
}

===================================================== */

function getMistakes(){

  try{
    return JSON.parse(
      localStorage.getItem("damtoMistakes") || "{}"
    );
  }
  catch(e){
    return {};
  }

}


function saveMistakes(x){

  localStorage.setItem(
    "damtoMistakes",
    JSON.stringify(x)
  );

  updateMistakes();
}


function wrongAnswer(id){

  let m=getMistakes();

  m[id]=(m[id]||0)+1;

  saveMistakes(m);
}


function correctAnswer(id){

  let m=getMistakes();

  if(m[id]){
    m[id]--;

    if(m[id]<=0){
      delete m[id];
    }

    saveMistakes(m);
  }

}


function updateMistakes(){

  let n=
    Object.keys(getMistakes()).length;

  document
  .getElementById("mistakeCount")
  .textContent=
    n ? "("+n+")" : "";

}


/* =====================================================
   MIX 5 × I/Í + 5 × Y/Ý
===================================================== */

function buildDeck(){

  let m=getMistakes();

  let soft=
    database.filter(
      x=>
        x.correct==="i" ||
        x.correct==="í"
    );

  let hard=
    database.filter(
      x=>
        x.correct==="y" ||
        x.correct==="ý"
    );

  soft=[
    ...shuffle(
      soft.filter(x=>m[x.id])
    ),
    ...shuffle(
      soft.filter(x=>!m[x.id])
    )
  ];

  hard=[
    ...shuffle(
      hard.filter(x=>m[x.id])
    ),
    ...shuffle(
      hard.filter(x=>!m[x.id])
    )
  ];

  return shuffle([
    ...soft.slice(0,5),
    ...hard.slice(0,5)
  ]);

}


/* =====================================================
   ZAČAŤ TRÉNING
===================================================== */

function startTraining(){

  questions=buildDeck();

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   PRECVIČOVANIE CHÝB
===================================================== */

function startMistakes(){

  let m=getMistakes();

  let list=
    database.filter(
      x=>m[x.id]
    );

  if(!list.length){

    alert(
      "Zatiaľ nemáš uložené žiadne chyby. 🎉"
    );

    return;
  }

  questions=
    shuffle(list)
    .slice(0,10);

  current=0;
  score=0;

  show("game");

  render();
}


/* =====================================================
   SPÄŤ DOMOV
===================================================== */

function goHome(){

  updateMistakes();

  show("home");
}


/* =====================================================
   ZOBRAZENIE OTÁZKY
===================================================== */

function render(){

  locked=false;
  selectedAnswerIndex=0;

  if(current>=questions.length){

    finish();

    return;
  }

  let x=questions[current];

  document
  .getElementById("counter")
  .textContent=
    (current+1)+" / "+questions.length;

  document
  .getElementById("points")
  .textContent=
    score;

  document
  .getElementById("bar")
  .style.width=
    (
      current /
      questions.length *
      100
    )+"%";

  document
  .getElementById("feedback")
  .innerHTML="";

  document
  .getElementById("feedback")
  .className="";

  document
  .getElementById("next")
  .classList
  .add("hidden");

  document
  .getElementById("levelBadge")
  .textContent=

    level===1
    ? "⭐ Skúšam"

    : level===2
    ? "⭐⭐ Už mi to ide"

    : "⭐⭐⭐ DámTo!";


  if(level===1){

    document
    .getElementById("instruction")
    .textContent=
      "✏️ Doplň správne písmeno";

    document
    .getElementById("question")
    .textContent=
      x.gap;

    let wrong=

      x.correct==="i"
      ? "y"

      : x.correct==="í"
      ? "ý"

      : x.correct==="y"
      ? "i"

      : "í";

    answers(
      [x.correct,wrong],
      x.correct
    );
  }


  if(level===2){

    document
    .getElementById("instruction")
    .textContent=
      "🧩 Vyber správne slovo";

    document
    .getElementById("question")
    .textContent=
      "Ktoré slovo je správne?";

    answers(
      [x.word,x.wrong],
      x.word
    );
  }


  if(level===3){

    document
    .getElementById("instruction")
    .textContent=
      "🔎 Lovec chýb";

    document
    .getElementById("question")
    .textContent=
      "Ktorá veta je napísaná správne?";

    let good=
      shuffle(x.sentences)[0];

    let bad=
      good.replace(
        x.word,
        x.wrong
      );

    if(good===bad){

      current++;

      render();

      return;
    }

    answers(
      [good,bad],
      good
    );
  }

}


/* =====================================================
   ODPOVEDE
===================================================== */

function answers(options,correct){

  let box=
    document
    .getElementById("answers");

  box.innerHTML="";

  let mixed=
    shuffle(options);

  mixed.forEach(
    (option,index)=>{

      let b=
        document
        .createElement("button");

      b.className=
        "answer";

      b.textContent=
        option;

      b.onclick=
        ()=>{

          selectedAnswerIndex=index;

          updateKeyboardSelection();

          check(
            option===correct
          );

        };

      box.appendChild(b);

    }
  );

  updateKeyboardSelection();
}


/* =====================================================
   ZVÝRAZNENIE ODPOVEDE
===================================================== */

function updateKeyboardSelection(){

  const buttons=[
    ...document
    .querySelectorAll(".answer")
  ];

  buttons.forEach(
    (button,index)=>{

      button.classList.toggle(
        "keyboardSelected",
        index===selectedAnswerIndex &&
        !button.disabled
      );

    }
  );

}


/* =====================================================
   VYHODNOTENIE
===================================================== */

function check(ok){

  if(locked){
    return;
  }

  locked=true;

  let x=
    questions[current];

  let f=
    document
    .getElementById("feedback");

  if(ok){

    score++;

    correctAnswer(
      x.id
    );

    f.className=
      "feedback good";

    f.innerHTML=
      "🎉 <b>Výborne!</b> Správna odpoveď.";

  }
  else{

    wrongAnswer(
      x.id
    );

    f.className=
      "feedback bad";

    f.innerHTML=
      "❌ <b>Nesprávne.</b> Správne je <b>"+
      x.word+
      "</b>.";

  }

  document
  .getElementById("points")
  .textContent=
    score;

  document
  .querySelectorAll(".answer")
  .forEach(
    b=>b.disabled=true
  );

  document
  .getElementById("next")
  .classList
  .remove("hidden");

}


/* =====================================================
   ĎALŠIA OTÁZKA
===================================================== */

function nextQuestion(){

  current++;

  render();

  window.scrollTo(0,0);
}


/* =====================================================
   KLÁVESNICA
===================================================== */

document.addEventListener(
  "keydown",
  function(event){

    const game=
      document.getElementById("game");

    if(
      !game ||
      game.classList.contains("hidden")
    ){
      return;
    }

    const buttons=[
      ...document.querySelectorAll(".answer")
    ];

    if(
      locked &&
      event.key==="Enter"
    ){

      event.preventDefault();

      nextQuestion();

      return;
    }

    if(
      locked ||
      !buttons.length
    ){
      return;
    }

    if(
      event.key==="ArrowRight" ||
      event.key==="ArrowDown"
    ){

      event.preventDefault();

      selectedAnswerIndex=
        (
          selectedAnswerIndex+1
        ) %
        buttons.length;

      updateKeyboardSelection();

      return;
    }

    if(
      event.key==="ArrowLeft" ||
      event.key==="ArrowUp"
    ){

      event.preventDefault();

      selectedAnswerIndex=
        (
          selectedAnswerIndex-1+
          buttons.length
        ) %
        buttons.length;

      updateKeyboardSelection();

      return;
    }

    if(event.key==="Enter"){

      event.preventDefault();

      const selected=
        buttons[
          selectedAnswerIndex
        ];

      if(
        selected &&
        !selected.disabled
      ){
        selected.click();
      }
    }

  }
);


/* =====================================================
   KONIEC TRÉNINGU
===================================================== */

function finish(){

  document
  .getElementById("finalScore")
  .textContent=
    score+
    " / "+
    questions.length;

  let p=
    score /
    questions.length;

  document
  .getElementById("finalMessage")
  .textContent=

    p===1
    ? "Perfektné! Bez chyby. 🌟"

    : p>=.8
    ? "Výborne! 🚀"

    : p>=.6
    ? "Pekná práca. 💪"

    : "Skús ešte jeden tréning. 🌱";

  updateMistakes();

  show("finish");
}


/* =====================================================
   SPUSTENIE
===================================================== */

updateMistakes();

</script>
